<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>儿童任务本 · 新链接</title>
  <style>
    :root { color-scheme: light; }
    html, body { margin:0; height:100%; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; }
    body { display:flex; align-items:center; justify-content:center; background:linear-gradient(160deg,#fdf3f7,#eef4ff); color:#4a3a44; }
    .card { max-width:400px; margin:20px; padding:28px 24px; background:#fff; border-radius:18px; box-shadow:0 8px 30px rgba(120,90,110,.14); text-align:center; }
    .ico { font-size:46px; line-height:1; }
    h1 { font-size:19px; margin:12px 0 8px; }
    p { font-size:14px; line-height:1.7; color:#7a6a74; margin:6px 0; }
    a.btn { display:inline-block; margin-top:14px; padding:10px 26px; border-radius:999px; background:#8a5a7a; color:#fff; text-decoration:none; font-weight:700; font-size:15px; }
    .cnt { color:#b0899e; font-size:12px; margin-top:10px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="ico">🏡✨</div>
    <h1>儿童任务本已升级搬迁</h1>
    <p>新家速度更快、数据云端实时同步。<br>正在带您前往新地址……</p>
    <a class="btn" id="go" href="#">立即前往</a>
    <p class="cnt">（<span id="sec">2</span> 秒后自动跳转，本页以后都是这个提示）</p>
  </div>
  <script>
    /* 旧参数（家庭码等）原样带给新家 */
    (function(){
      var NEW = 'https://kidtask-38688.app.workbuddy.host/?sharecode=YO6THDFZJR';
      try {
        var q = location.search.replace(/^\?/, '');
        if(q) q = q.split('&').filter(function(kv){ return kv && kv.indexOf('sharecode=') !== 0; }).join('&');
        var target = NEW + (q ? '&' + q : '');
        var a = document.getElementById('go'); a.href = target;
        var s = 2;
        var t = setInterval(function(){
          s--; document.getElementById('sec').textContent = s;
          if(s <= 0){ clearInterval(t); try { location.replace(target); } catch(e){ location.href = target; } }
        }, 1000);
      } catch(e){ location.replace(NEW); }
      /* 旧 PWA 的 Service Worker 自我注销 + 清缓存，避免缓存住本页 */
      if('serviceWorker' in navigator){
        navigator.serviceWorker.getRegistrations && navigator.serviceWorker.getRegistrations().then(function(rs){ rs.forEach(function(r){ r.unregister(); }); }).catch(function(){});
      }
      if(window.caches && caches.keys){ caches.keys().then(function(ks){ ks.forEach(function(k){ caches.delete(k); }); }).catch(function(){}); }
    })();
  </script>
  <noscript><a href="https://kidtask-38688.app.workbuddy.host/?sharecode=YO6THDFZJR">请点击前往新地址</a></noscript>
</body>
</html>
