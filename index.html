<script>
  // 阻止触控板/移动端的双击与捏合缩放导致整页突然变大
  ['gesturestart','gesturechange','gestureend'].forEach(function(ev){
    document.addEventListener(ev, function(e){ e.preventDefault(); }, { passive: false });
  });
  // 双击会触发浏览器缩放，儿童点击频繁，统一拦截
  document.addEventListener('dblclick', function(e){ e.preventDefault(); }, { passive: false });
</script>

    width:20px; height:20px; border-radius:50%; overflow:hidden;
    display:inline-flex; align-items:center; justify-content:center;
    background:radial-gradient(circle at 30% 25%, #ffffff, var(--accent-hover, #fff0f5));
    box-shadow:0 1px 3px rgba(0,0,0,.12);
    border:1.5px solid var(--title);
    animation:mascotFloat 3.2s ease-in-out infinite;
  }
  /* 主题吉祥物：logo 与积分兔子随角色主题切换形象并轻微摇摆 */
  [data-char] #logoMascot, [data-char] #starsMascot { display:inline-flex; align-items:center; justify-content:center; animation: mascotWobble 1.6s ease-in-out infinite; transform-origin:center bottom; }
  @keyframes mascotWobble { 0%,100%{ transform: translateY(0) rotate(-6deg);} 50%{ transform: translateY(-3px) rotate(6deg);} }
  @keyframes mascotFloat { 0%,100%{ transform: translateY(0);} 50%{ transform: translateY(-3px);} }
  .stars-box .big svg { display:block; }
  .stars-box .star-txt { display:flex; flex-wrap:wrap; gap:2px; align-items:baseline; justify-content:center; }
  .stars-box .star-num { display:inline-flex; gap:1px; align-items:baseline; white-space:nowrap; }
  .stars-box .star-label, .stars-box .star-unit { white-space:nowrap; }
  .stars-box .star-txt b { font-size: 11px; }

  /* 主题切换页：皮肤主题卡片网格 */
  .theme-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:16px; margin-top:8px; }
  .theme-card {
    position:relative; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:10px; padding:18px 12px 16px; border:none; border-radius:20px; cursor:pointer;
    background:var(--card); box-shadow:var(--shadow); overflow:hidden;
    transition:transform .14s, box-shadow .14s;
  }
  .theme-card:hover { transform:translateY(-3px); }
  .theme-card:active { transform:scale(.97); }
  .theme-card.active { box-shadow:0 0 0 3px var(--accent), var(--shadow); }
  .theme-card-bg { width:100%; height:64px; border-radius:14px; box-shadow:inset 0 0 0 2px rgba(255,255,255,.7); }
  .theme-card-name { font-size:16px; font-weight:800; color:var(--title); }
  .theme-card-check {
    position:absolute; top:10px; right:12px; width:24px; height:24px; border-radius:50%;
    background:var(--accent); color:#fff; font-size:14px; font-weight:900;
    display:flex; align-items:center; justify-content:center; box-shadow:0 2px 6px rgba(0,0,0,.2);
  }
  .model-row { display:flex; align-items:center; gap:6px; padding:2px 2px 0; flex-wrap:wrap; flex-shrink:0; }
  .model-label { font-size:11px; font-weight:800; color:var(--nav-ink); white-space:nowrap; }
  .model-picker { display:flex; gap:4px; flex-wrap:wrap; justify-content:center; }
  .model-swatch {
    font-size:10px; font-weight:800; cursor:pointer;
    border:1.5px solid rgba(255,255,255,0.85); border-radius:999px;
    padding:2px 7px; background:rgba(255,255,255,0.45); color:var(--nav-ink);
    transition:transform .12s, box-shadow .12s;
  }
  .model-swatch:hover { transform:scale(1.06); }
  .model-swatch.active { background:var(--card); box-shadow:var(--shadow); color:var(--title); border-color:#fff; }

  /* ===== 多设备同步 ===== */
  .sync-status {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 12px;
    font-weight: 800;
    padding: 3px 9px;
    border-radius: 999px;
    cursor: default;
    transition: background .2s, color .2s;
  }
  .sync-status .dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: #c9b8c9;
  }
  .sync-status.on { background: #e7f7ee; color: #1e8e4e; }
  .sync-status.on .dot { background: #5fb896; }
  .sync-status.off { background: #fdeaf0; color: #d63a5e; }
  .sync-status.off .dot { background: #e75a7a; }
  .sync-status.pending { background: #fff4e0; color: #b06a8a; }
  .sync-status.pending .dot { background: #f0a500; }
  .sync-invite {
    font-size: 12px;
    font-weight: 800;
    border: none;
    border-radius: 999px;
    padding: 4px 10px;
    cursor: pointer;
    background: var(--accent-soft);
    color: var(--accent-d);
    transition: transform .12s;
  }
  .sync-invite:hover { transform: scale(1.05); }
  .sync-now {
    font-size: 12px;
    font-weight: 800;
    border: none;
    border-radius: 999px;
    padding: 4px 10px;
    cursor: pointer;
    background: var(--accent);
    color: #fff;
    transition: transform .12s;
  }
  .sync-now:hover { transform: scale(1.05); }
  .sync-now:active { transform: scale(.95); }
  /* 邀请家人弹窗 */
  .invite-url {
    word-break: break-all;
    background: var(--bg);
    border: 1.5px dashed var(--accent-soft);
    border-radius: 12px;
    padding: 12px 14px;
    font-size: 13px;
    color: var(--accent-d);
    user-select: text;
    -webkit-user-select: text;
    margin: 6px 0 14px;
  }
  .invite-tip { font-size: 12px; color: var(--accent-d); opacity: .8; margin: 10px 2px 0; min-height: 16px; text-align: center; }
  /* 设备角色切换按钮（侧栏底部） */
  .role-switch {
    margin: 8px 4px 2px;
    width: 100%;
    font-size: 12px;
    font-weight: 800;
    border: none;
    border-radius: 999px;
    padding: 7px 10px;
    cursor: pointer;
    background: var(--accent-soft);
    color: var(--accent-d);
    transition: transform .12s;
  }
  .role-switch:hover { transform: scale(1.03); }
  .role-switch:active { transform: scale(.97); }
  .role-switch .rs-emoji { margin-right: 4px; }
  /* 邀请弹窗：孩子端 / 家长端 两张链接卡片 */
  .invite-card { background: var(--card); border: 2px solid var(--accent-soft); border-radius: 16px; padding: 12px 14px; margin: 10px 0; }
  .invite-card-head { display:flex; align-items:center; gap:6px; font-size: 14px; font-weight: 900; color: var(--accent-d); margin-bottom: 6px; }
  .invite-card .invite-url { margin: 0 0 10px; }
  .invite-copy { width: 100%; }

  /* ===== 主区域 ===== */
  .main { flex: 1; padding: 26px 32px; overflow-y: auto; overflow-x: hidden; min-width: 0; }
  .page-title { font-size: 30px; font-weight: 800; margin: 0 0 4px; color: var(--title); }
  .page-head { display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; }
  .parent-entry {
    font:inherit; font-weight:800; font-size:14px; cursor:pointer; white-space:nowrap;
    border:none; border-radius:999px; padding:9px 16px;
    background:var(--purple); color:#7a4a8a;
    box-shadow:0 3px 0 #b98fd0;
  }
  .parent-entry:active { transform:translateY(2px); box-shadow:0 1px 0 #b98fd0; }
  .back-btn { background:var(--accent-soft); color:var(--accent-d); border:2px solid var(--accent-soft); border-radius:999px; padding:8px 16px; font:inherit; font-weight:800; font-size:14px; cursor:pointer; box-shadow:0 3px 0 #f1d7e6; }
  .back-btn:active { box-shadow:0 1px 0 #f1d7e6; transform:translateY(2px); }
  /* 答题后锁定返回按钮（强制读完解析，至少 3 秒） */
  .back-btn.return-locked { opacity:.55; cursor:not-allowed; pointer-events:none; box-shadow:none; background:#eee; color:#999; border-color:#e0e0e0; }
  /* 统一「答案解析」展示块 */
  .quiz-explain { margin-top:10px; padding:10px 12px; border-radius:12px; background:#eef6ff; border:1px solid #cfe3ff; text-align:left; }
  .quiz-explain .qe-ico { margin-right:4px; }
  .quiz-explain .qe-t { font-weight:800; color:#2f6fb0; }
  .quiz-explain .qe-b { margin-top:4px; font-size:14px; color:#3a5a7a; line-height:1.6; }
  .quiz-explain .qe-b b { color:#1f4f86; }
  .page-sub { margin: 0 0 22px; color:#9c7b8e; font-size: 16px; }
  .write-tip { display:flex; align-items:flex-start; gap:12px; margin:0 0 18px; padding:14px 16px; background:linear-gradient(135deg, var(--accent) 0%, var(--accent-d) 100%); color:#fff; border-radius:16px; box-shadow:var(--sh-pink); position:relative; overflow:hidden; animation: wtPulse 2.6s ease-in-out infinite; }
  @keyframes wtPulse { 0%,100% { transform: scale(1); box-shadow: var(--sh-pink); } 50% { transform: scale(1.015); box-shadow: 0 8px 22px rgba(0,0,0,.22); } }
  @media (prefers-reduced-motion: reduce) { .write-tip { animation: none; } }
  .write-tip .wt-emoji { font-size:30px; line-height:1.1; flex:0 0 auto; filter: drop-shadow(0 2px 3px rgba(0,0,0,.18)); }
  .write-tip .wt-text { flex:1 1 auto; min-width:0; }
  .write-tip .wt-label { display:block; font-size:14px; font-weight:900; color:#fff; margin-bottom:3px; text-shadow:0 1px 2px rgba(0,0,0,.18); }
  .write-tip .wt-msg { font-size:15px; font-weight:800; color:rgba(255,255,255,.97); line-height:1.55; }
  .write-tip .wt-close { flex:0 0 auto; border:none; background:rgba(255,255,255,.22); color:#fff; font-size:15px; cursor:pointer; padding:3px 7px; border-radius:9px; line-height:1.2; }
  .write-tip .wt-close:hover { background:rgba(255,255,255,.4); }
  .bal-banner { display:inline-flex; align-items:center; gap:10px; background:#fff; border:2px solid var(--accent-soft); color:var(--accent); font-size:18px; font-weight:600; padding:10px 20px; border-radius:999px; margin:0 0 16px; box-shadow:var(--sh-pink-sm); }
  .bal-banner b { font-size:26px; color:var(--accent-d); line-height:1; }
  .bal-banner .gem { font-size:22px; }
  .game-cards { display:grid; grid-template-columns:repeat(auto-fill, minmax(200px,1fr)); gap:16px; margin-bottom:24px; }
  .game-card { background:#fff; border:2px solid var(--accent-soft); border-radius:20px; padding:22px; cursor:pointer; transition:transform .15s, box-shadow .2s; box-shadow:0 4px 12px rgba(231,84,128,.1); }
  .relax-banner { background:linear-gradient(135deg,#fff5fb,#ffe9f3); border:2px solid #ffd0e4; border-radius:16px; padding:12px 16px; margin:6px 0 18px; box-shadow:var(--sh-pink-sm); }
  .relax-banner.off { background:#f3f7ff; border-color:#cfe0ff; }
  .relax-banner.done { background:#fff0e8; border-color:#ffc9a8; }
  .relax-banner .rb-top { font-size:15px; color:#7a4a5e; font-weight:600; display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
  .relax-banner .rb-emo { font-size:18px; }
  .relax-banner .rb-top b { color:#e7548c; }
  .relax-banner.done .rb-top b { color:#e8743a; }
  .relax-banner .rb-bar { height:10px; background:#ffe1ee; border-radius:8px; overflow:hidden; margin-top:8px; }
  .relax-banner.off .rb-bar { display:none; }
  .relax-banner .rb-bar span { display:block; height:100%; width:0; background:linear-gradient(90deg,#ffb3d4,#e7548c); transition:width .4s; }
  .relax-banner .rb-bar span.full { background:linear-gradient(90deg,#ffb27a,#e8743a); }
  .relax-banner .rb-note { margin-top:6px; font-size:13px; color:#e8743a; font-weight:600; }
  .game-card:hover { transform:translateY(-3px); box-shadow:0 8px 18px rgba(231,84,128,.18); }
  .game-card:active { transform: translateY(0) scale(.98); box-shadow:var(--sh-pink-sm); }
  .gc-emoji { font-size:42px; line-height:1; margin-bottom:12px; display:inline-flex; align-items:center; justify-content:center; width:82px; height:82px; border-radius:50%; background:linear-gradient(160deg,#fff2f8,#ffe0ec); border:2px solid #ffd0e2; box-shadow:0 7px 16px rgba(231,84,128,.20), inset 0 0 0 3px #fff; animation:bob 3.2s ease-in-out infinite; }
  .game-card:hover .gc-emoji { transform:translateY(-4px) scale(1.07) rotate(-3deg); box-shadow:0 12px 24px rgba(231,84,128,.30), inset 0 0 0 3px #fff; }
  @keyframes bob { 0%,100%{ transform:translateY(0) rotate(0); } 50%{ transform:translateY(-6px) rotate(2deg); } }
  .gc-name { font-size:19px; font-weight:700; color:var(--accent); margin-bottom:4px; }
  .gc-desc { font-size:14px; color:#9c7b8e; }
  .reading-cards { display:grid; grid-template-columns:repeat(auto-fill, minmax(220px,1fr)); gap:16px; margin-bottom:24px; }
  .reading-card { background:var(--card); border:2px solid var(--accent-soft); border-radius:18px; padding:20px; transition:transform .15s, box-shadow .2s; box-shadow:0 4px 12px rgba(231,84,128,.08); cursor:pointer; }
  .reading-card:hover { transform:translateY(-3px); box-shadow:0 8px 18px rgba(231,84,128,.15); }
  .rc-done { display:inline-block; margin-top:10px; background:#e8f7ee; color:#2e9e4f; border:1px solid #b7e6c8; border-radius:999px; padding:3px 12px; font-size:13px; font-weight:600; }
  .book-modal { text-align:center; }
  .bm-emoji { font-size:64px; line-height:1; margin-bottom:8px; }
  .bm-sub { font-size:15px; font-weight:600; color:var(--accent); margin-bottom:8px; }
  .bm-grade { display:inline-block; background:var(--accent-hover); border:1px solid var(--accent-soft); color:var(--accent); border-radius:999px; padding:5px 14px; font-size:14px; font-weight:600; margin-bottom:14px; }
  .bm-desc { font-size:15px; color:var(--ink); line-height:1.7; text-align:left; margin:0 0 14px; }
  .bm-tip { font-size:14px; color:var(--nav-ink-soft); line-height:1.7; text-align:left; background:var(--accent-hover); border-radius:14px; padding:12px 14px; margin:0 0 6px; }
  .dice-wrap { background:#fff; border:2px solid var(--accent-soft); border-radius:22px; padding:36px 20px; text-align:center; max-width:420px; }
  /* 脑筋急转弯 */
  .brain-card { background:#fff; border:2px solid var(--accent-soft); border-radius:22px; padding:30px 22px; text-align:center; max-width:480px; margin:0 auto; box-shadow:0 6px 18px rgba(231,84,128,.12); }
  .brain-emoji { font-size:56px; line-height:1; margin-bottom:14px; }
  .brain-q { font-size:21px; font-weight:800; color:var(--title); line-height:1.65; margin-bottom:18px; }
  .brain-a { font-size:18px; font-weight:700; color:var(--accent-d); background:var(--accent-hover); border-radius:14px; padding:14px 16px; margin-bottom:18px; line-height:1.6; }
  .brain-actions { display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin-bottom:14px; }
  .brain-actions .btn { flex:0 0 auto; }
  .brain-tip { font-size:14px; color:#9c7b8e; line-height:1.7; }
  .brain-net { font-size:12.5px; color:#8a6fa0; background:#f3eef9; border:1px solid #e6ddf2; border-radius:10px; padding:3px 10px; display:inline-block; margin-left:6px; }
  /* 趣味成语 */
  .idiom-card { background:#fff; border:2px solid var(--accent-soft); border-radius:22px; padding:30px 22px; text-align:center; max-width:480px; margin:0 auto; box-shadow:0 6px 18px rgba(231,84,128,.12); }
  .chain-emoji, .scene-emoji, .cloze-emoji { font-size:54px; line-height:1; margin-bottom:14px; }
  .chain-cur { font-size:30px; font-weight:900; color:var(--accent-d); letter-spacing:4px; margin-bottom:10px; }
  .chain-req { font-size:17px; color:var(--title); margin-bottom:16px; }
  .chain-req b { color:var(--accent); }
  .chain-input { width:100%; max-width:320px; padding:12px 14px; font-size:18px; border:2px solid var(--accent-soft); border-radius:14px; text-align:center; outline:none; margin-bottom:12px; }
  .chain-input:focus { border-color:var(--accent); }
  .chain-feedback { font-size:15px; min-height:22px; margin-bottom:12px; color:#7a5a6e; }
  .chain-feedback.cf-ok { color:#1f9d55; font-weight:700; }
  .chain-feedback.cf-warn { color:#e0533c; font-weight:700; }
  .chain-feedback.cf-hint { color:var(--accent-d); font-weight:700; }
  .scene-desc { font-size:18px; line-height:1.8; color:var(--title); background:var(--accent-hover); border-radius:14px; padding:16px; margin-bottom:18px; }
  .idiom-opts { display:flex; gap:12px; justify-content:center; flex-wrap:wrap; margin-bottom:14px; }
  .idiom-opt { background:var(--accent-soft); border:2px solid var(--accent-soft); border-radius:14px; padding:12px 18px; font-size:18px; font-weight:700; color:var(--title); cursor:pointer; transition:all .15s; min-width:96px; }
  .idiom-opt:hover { border-color:var(--accent); transform:translateY(-2px); }
  .idiom-opt.correct { background:#e6f7ec; border-color:#1f9d55; color:#1f9d55; }
  .idiom-opt.wrong { background:#fdecea; border-color:#e0533c; color:#e0533c; }
  .cloze-idiom { font-size:30px; font-weight:900; letter-spacing:6px; color:var(--title); margin-bottom:18px; }
  .cloze-idiom .blank { color:var(--accent); border-bottom:4px solid var(--accent); padding:0 6px; }
  .voice-row { display:flex; flex-direction:column; align-items:center; gap:8px; margin:4px 0 6px; }
  .voice-btn { -webkit-appearance:none; appearance:none; -webkit-tap-highlight-color:transparent; background-color:#7b4dff; background:linear-gradient(160deg,#a86bff,#7b4dff); color:#fff; border:none; border-radius:999px; padding:11px 26px; font-size:16px; font-weight:700; cursor:pointer; box-shadow:0 5px 14px rgba(123,77,255,.28); transition:transform .12s, box-shadow .12s; outline:none; }
  .voice-btn:hover { transform:translateY(-1px); }
  .voice-btn:focus, .voice-btn:focus-visible { outline:none; box-shadow:0 0 0 3px rgba(123,77,255,.45), 0 5px 14px rgba(123,77,255,.28); }
  .voice-btn:active { transform:translateY(1px); background-color:#6a3fd6; background:linear-gradient(160deg,#8a5cf0,#6a3fd6); }
  .voice-btn.listening { background-color:#e03e6b; background:linear-gradient(160deg,#ff5d8f,#e03e6b); animation:pulseMic 1.1s infinite; }
  .voice-btn.listening:active { background-color:#c5305c; background:linear-gradient(160deg,#e04d7c,#c5305c); }
  @keyframes pulseMic { 0%{box-shadow:0 0 0 0 rgba(224,62,107,.5);} 70%{box-shadow:0 0 0 14px rgba(224,62,107,0);} 100%{box-shadow:0 0 0 0 rgba(224,62,107,0);} }
  .voice-status { font-size:14px; color:#7a5a6e; min-height:20px; line-height:1.6; max-width:340px; }
  .voice-status.err { color:#e0533c; }
  .voice-hint { font-size:13px; color:#9c7b8e; margin-top:2px; }
  .en-entry-card { border-color:#ffc2dd; background:linear-gradient(160deg,#fff6fb,#ffecf5); }
  .en-entry-card .ce-emoji { font-size:40px; }
  .en-card { background:#fff; border:2px solid var(--accent-soft); border-radius:22px; padding:26px 22px; margin-bottom:18px; box-shadow:0 6px 18px rgba(231,84,128,.10); }
  .en-passage { font-size:22px; line-height:2; color:var(--title); font-weight:600; }
  .en-line { display:flex; align-items:baseline; gap:8px; margin-bottom:8px; }
  .en-line .en-word { display:inline; }
  .en-play { flex:0 0 auto; align-self:center; background:linear-gradient(160deg,#ff9ec7,#ff6fa5); color:#fff; border:none; border-radius:999px; padding:5px 12px; font-size:15px; font-weight:700; cursor:pointer; box-shadow:0 3px 9px rgba(255,111,165,.30); -webkit-appearance:none; appearance:none; -webkit-tap-highlight-color:transparent; outline:none; transition:transform .12s; }
  .en-play:hover { transform:translateY(-1px); }
  .en-play:active { background:linear-gradient(160deg,#ff7fb3,#ff5d95); }
  .en-play:focus, .en-play:focus-visible { outline:none; box-shadow:0 0 0 3px rgba(255,111,165,.4); }
  .en-play.playing { background:linear-gradient(160deg,#ffb84d,#ff8c1a); animation:pulseMic 1s infinite; }
  .en-playall { margin-top:12px; }
  .en-word { background:linear-gradient(160deg,#ffd9ec,#ffc2dd); color:#c21f63; border-radius:8px; padding:1px 6px; font-weight:800; box-shadow:0 2px 0 rgba(194,31,99,.18); }
  .en-words { display:flex; flex-direction:column; gap:12px; margin-bottom:14px; }
  .en-row { display:flex; align-items:center; gap:10px; flex-wrap:wrap; background:#fff; border:2px solid var(--accent-soft); border-radius:16px; padding:10px 14px; }
  .en-row.en-correct { border-color:#7bd88f; background:#f1fcf3; }
  .en-row.en-wrong { border-color:#ffb0a8; background:#fff4f2; }
  .en-word-en { font-size:20px; font-weight:800; color:var(--accent); min-width:96px; }
  .en-input { flex:1 1 160px; min-width:120px; font-size:17px; padding:9px 12px; border:2px solid #ffd0e2; border-radius:12px; outline:none; }
  .en-input:focus { border-color:var(--accent); }
  .en-voice { padding:9px 14px; font-size:17px; }
  .en-ans { font-size:14px; color:#9c7b8e; flex-basis:100%; margin-top:2px; }

  .en-row.en-wrong .en-ans { color:#e0533c; }

    margin-top: 18px; width: 100%;

    border: none; border-radius: 16px; padding: 14px;
    cursor: pointer; color:#fff; background: var(--accent, #e75480); background-color: var(--accent, #e75480);
    box-shadow: 0 4px 0 var(--accent-d, #d63a5e); transition: transform .08s, background .12s;
    appearance:none; -webkit-appearance:none; -webkit-tap-highlight-color:transparent; outline:none;
  }
  .btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--accent-d, #d63a5e); background: var(--accent-d, #d63a5e); background-color: var(--accent-d, #d63a5e); }
  /* 触摸设备：原生 :active/:hover 在点击后会一直“粘住”不恢复（iOS/移动端 Safari 已知行为）。
     改用 JS 的 .is-pressed 类表达按下反馈（pointerup 一定移除，不粘），并强制 :active/:hover 回到正常色。 */
  @media (hover: none) and (pointer: coarse) {
    .btn:active, .btn:hover,
    .btn.primary:active, .btn.primary:hover,
    .btn.cancel:active, .btn.cancel:hover {
      background: var(--accent) !important; background-color: var(--accent) !important; color: #fff !important;
      transform: none !important; box-shadow: 0 4px 0 var(--accent-d) !important;
    }
    .btn.cancel:active, .btn.cancel:hover {
      background: var(--accent-soft) !important; background-color: var(--accent-soft) !important; color: var(--accent) !important;
    }
    .btn.is-pressed { background: var(--accent-d) !important; background-color: var(--accent-d) !important; color: #fff !important; transform: translateY(3px) !important; box-shadow: 0 1px 0 var(--accent-d) !important; }
    .btn.cancel.is-pressed { background: var(--accent) !important; background-color: var(--accent) !important; color: var(--accent-soft) !important; }

  /* 提交答卷/提交批改按钮：用 .btn.quiz-submit 提升优先级，盖过任何 .btn 白色样式；

  /* 周视图 / 月历视图切换与月历 */
  .date-bar { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }

  .cal-holi { font-size:10px; font-weight:900; color:#e23e6a; line-height:1.1; }

  .task {

  /* ===== 睡前故事「离线」可爱弹窗动画 ===== */
  .story-offline { background: rgba(58,44,74,.5); z-index: 195; }
  .story-offline.leaving { background: rgba(58,44,74,0); transition: background .3s; }
  .so-card {
    position: relative; overflow: visible;
    background: linear-gradient(165deg,#ffffff 0%,#f3ecff 58%,#e7ddff 100%);
    border-radius: 30px; padding: 30px 26px 24px; width: 100%; max-width: 360px;
    text-align: center; box-shadow: 0 18px 50px rgba(80,60,120,.38);

  @keyframes soLeave { 0%{ opacity:1; transform: scale(1); } 100%{ opacity:0; transform: scale(.85) translateY(10px); } }

  .so-z1 { font-size: 20px; animation: soZ 2s ease-in-out infinite; }

  .so-z3 { font-size: 12px; top: 44px; right: -28px; animation: soZ 2s ease-in-out .9s infinite; }
  @keyframes soZ { 0%{ opacity:0; transform: translateY(6px) scale(.6) rotate(-8deg); } 40%{ opacity:1; } 100%{ opacity:0; transform: translateY(-22px) scale(1) rotate(6deg); } }
  .so-title { color: #7a5ab0; font-size: 22px; margin: 10px 0 6px; font-weight: 800; }
  .so-msg { color: #6a5a86; font-size: 16px; line-height: 1.75; font-weight: 700; white-space: pre-line; margin: 0 0 18px; }
  .so-ok { width: 100%; }

  .so-star.s1 { left: 14px; top: 22px; }

  @keyframes soTw { 0%,100%{ opacity: .3; transform: scale(.7); } 50%{ opacity: 1; transform: scale(1.15); } }

/* 中国法定节假日数据（国务院办公厅发布）。自 2026-08-31 起改为「按年份」结构：

const DEFAULT_HOLIDAYS = {  // 2026年（国办发明电〔2025〕7号）

  '2026-05-01':{name:'劳动节',type:'rest'}, '2026-05-02':{name:'劳动节',type:'rest'}, '2026-05-03':{name:'劳动节',type:'rest'}, '2026-05-04':{name:'劳动节',type:'rest'}, '2026-05-05':{name:'劳动节',type:'rest'},

  }
};
const HOLI_KEY = 'kidtask_holidays_v1';
function saveHolidaysStore(obj){ try { localStorage.setItem(HOLI_KEY, JSON.stringify(obj)); } catch(e){} }
function getHolidaysStore(){
  try {
    const raw = localStorage.getItem(HOLI_KEY);
    if(raw){
      const o = JSON.parse(raw);
      if(o && typeof o==='object'){
        const keys = Object.keys(o);
        const looksOld = keys.length && keys.every(k=>/^\d{4}-\d{2}-\d{2}$/.test(k));  // 旧版：扁平 iso→{name,type}
        if(looksOld){ const migrated = {2026:o}; for(const y in DEFAULT_HOLIDAYS){ if(!migrated[y]) migrated[y]=DEFAULT_HOLIDAYS[y]; } saveHolidaysStore(migrated); return migrated; }
        return o;
      }
    }
  } catch(e){}
  saveHolidaysStore(DEFAULT_HOLIDAYS);
  return JSON.parse(JSON.stringify(DEFAULT_HOLIDAYS));
}
function getHolidayMapForYear(year){ const store = getHolidaysStore(); return (store && store[year]) || {}; }
/* 联网源：NateScarlet/holiday-cn（基于国务院数据，jsDelivr 提供 CORS），每年一个 {year}.json */
const HOLI_API = (y)=> `https://cdn.jsdelivr.net/gh/NateScarlet/holiday-cn@master/${y}.json`;
function mapApiToHolidays(data){
  const map = {};

  for(const x of days){ if(x && x.date){ map[x.date] = { name: x.name||'', type: x.isOffDay ? 'rest' : 'work' }; } }

  } catch(e){ return null; }
}

const DEFAULT_REWARDS = [

/* ===== 计分/计星的唯一真相：dayOps 里 d:1 的「完成」记录 =====
   规则（用户明确要求）：只有真实点击完成才会计分、计星——
     · 只数 dayOps 中 d===1 的日期（撤销 d:0 不算、从未点过的日期不算）
     · 取消任务**不清零历史**：取消前点过的完成照常计分计星（cancelled 不再拦截）
     · 一次性任务最多算 1 次（最近一次完成那条）
     · 不依赖 t.done 派生字段，避免派生滞后导致少算/多算 */
function taskDoneDays(t){
  if(!t) return [];
  const ops = (t.dayOps && typeof t.dayOps === 'object') ? t.dayOps : null;
  let days;
  if(ops) days = Object.keys(ops).filter(d => ops[d] && Number(ops[d].d) === 1).sort();
  else if(t.done){
    /* 无 dayOps 的老数据兜底：归属顺序与 ensureDayOps 迁移保持一致 doneDates → doneDate → doneAt，

    let arr = (Array.isArray(t.doneDates) && t.doneDates.length) ? t.doneDates.slice()
            : (t.doneDate ? [t.doneDate] : []);
    if(!arr.length && t.doneAt){ try { arr = [fmtISO(new Date(Number(t.doneAt)))]; } catch(e){} }
    days = arr.filter(Boolean).sort();
  } else days = [];
  if(!days.length) return [];
  /* 一次性任务只算 1 次：日期取「最近一次完成」（与旧 doneDate 语义一致，日历归属不跳变） */
  if(!t.repeat || t.repeat === 'once') days = [days[days.length - 1]];
  return days;
}
/* 任务「已完成次数」= 有效星星数（每次真实点击完成 +1 星） */
function taskDoneCount(t){ return taskDoneDays(t).length; }
/* 某一天完成时「当时」应得的积分：取该天记录的快照分值 p；无快照（老数据）才回退当前分值；当天未完成返回 0 */
function dayDoneValue(t, iso){
  if(!t || !iso) return 0;      // 取消任务的历史完成同样计分（口径见 taskDoneDays）
  if(taskDoneDays(t).indexOf(iso) < 0) return 0;
  const o = (t.dayOps && typeof t.dayOps === 'object') ? t.dayOps[iso] : null;
  const p = o ? Number(o.p) : NaN;
  if(!isNaN(p) && o && o.p != null) return p;
  return Number(t.points) || Number(t.stars) || 0;
}
/* 整个任务累计应得积分 = Σ 每次真实完成当时的分值（改分值不追溯篡改历史） */
function taskPointsEarned(t){
  let s = 0;
  for(const d of taskDoneDays(t)) s += dayDoneValue(t, d);
  return s;
}
/* 任务「完成日期列表」：一次性返回首次完成日；周期返回全部完成日（用于日历按天归属积分/星星） */
function doneDateList(t){ return taskDoneDays(t); }
/* ===== 任务完成态：按天「最后操作胜」(dayOps) =====
   背景：早期合并用「done 取 OR + doneDates 并集」，导致「撤销完成」永远同步不过去
   （A 端撤销 done=false，B 端仍 true → OR 后仍是 true，撤销被吞，孩子端一直显示已完成）。
   改造：每天记录一次操作（完成 d:1 / 撤销 d:0）并打逻辑时钟 ts；
   合并时同一天取 ts 较大者 → 完成与撤销都能跨端传播，不同日期仍互不影响（各端完成历史都保留）。 */
function ensureDayOps(t){
  if(!t) return {};
  if(t.dayOps && typeof t.dayOps === 'object') return t.dayOps;
  const ops = {};
  const baseTs = Number(t.ts) || 0;                 // 老数据沿用任务 ts（可能为 0）
  const at = Number(t.doneAt) || 0;
  if(t.done){
    /* 按 doneDates → doneDate → doneAt 顺序归属完成日期：
       不再区分是否周期任务——老数据里「无 repeat 字段」或「一次性任务」也可能带 doneDates，
       若按 repeat 分支判断会漏迁移，导致合并时完成历史被清空 */
    let arr = [];
    if(Array.isArray(t.doneDates) && t.doneDates.length) arr = t.doneDates;
    else if(t.doneDate) arr = [t.doneDate];
    else if(at){ try { arr = [fmtISO(new Date(at))]; } catch(e){} }
    const p = Number(t.points) || Number(t.stars) || 0;   // 老数据无法还原当时的分值，按当前分值快照（与旧口径一致，不掉分）
    for(const d of arr){ if(d) ops[d] = { d:1, ts: baseTs, at: at, p: p }; }
  }
  t.dayOps = ops;
  return ops;
}
/* 由 dayOps 派生出 done / doneDates / doneDate / doneAt —— 各端派生规则一致，保证三端显示统一 */
function deriveTaskDone(t){
  const ops = (t && t.dayOps && typeof t.dayOps === 'object') ? t.dayOps : {};
  const days = Object.keys(ops).filter(d => ops[d] && ops[d].d === 1).sort();
  t.doneDates = days;
  t.done = days.length > 0;
  t.doneDate = days.length ? days[days.length - 1] : null;
  const last = days.length ? ops[days[days.length - 1]] : null;
  t.doneAt = (last && Number(last.at)) ? Number(last.at) : null;
}
/* 完成 / 撤销某一天：唯一写入口，保证 dayOps 与派生字段同步推进（ts 用逻辑时钟，跨设备可比） */
function setTaskDayDone(t, day, isDone){
  if(!t) return;
  ensureDayOps(t);
  const d = day || fmtISO(todayInfo().date);
  /* p = 完成时应计的分值快照：只有真实点击完成才计分，且按点击当时的分值计（之后改分值不追溯篡改历史）。
     ⚠️ 若这一天此前已有记录（撤销后再点完成），沿用原快照 → 「点过完成又撤销」能精确恢复到之前的积分和星星 */
  const _prev = t.dayOps[d];
  const _pv = (_prev && _prev.p != null) ? _prev.p : (Number(t.points) || Number(t.stars) || 0);
  t.dayOps[d] = { d: isDone ? 1 : 0, ts: bumpSyncTs(), at: Date.now(), p: _pv };
  deriveTaskDone(t);
  if(deviceRole === 'child') publishChildEvent({ kind:'taskDone', taskId:t.id, day:d, done:isDone?1:0, pts:_pv }); // 落地版方案B：孩子端完成/撤销发事件
}
/* 取消 / 恢复取消：同样按「最后操作胜」，让「取消」和「恢复」都能跨端传播。
   ⚠️ 取消**不再清空**历史完成记录（2026-09-10 用户口径）：
   之前取消会把所有 d:1 写成 d:0，导致「以前点完成赚到的积分和星星被清零且恢复不回来」。
   现在只标记 cancelled——历史已获得的积分/星星原样保留，取消后仅停止新增完成（卡片不可点），
   恢复取消后历史完成态也还在，不需要重新完成。 */
function setTaskCancel(t, isCancel, reason){
  if(!t) return;
  t.cancelOp = { c: isCancel ? 1 : 0, ts: bumpSyncTs(), reason: (reason != null ? String(reason) : (t.reason || '')) };
  deriveTaskCancel(t);
}
function deriveTaskCancel(t){
  const op = t.cancelOp;
  if(!op) return;                                   // 老数据无取消操作记录：保留原 cancelled 值
  if(Number(op.c) === 1){ t.cancelled = true; if(op.reason != null) t.reason = op.reason; }
  else { t.cancelled = false; }
}
function starCount(){
  const base = tasks.reduce((s,t)=>s+taskDoneCount(t),0) + (Number(extra.stars)||0);
  const spent = Math.max((dice && dice.used) || 0, starLog.length);
  /* 数据漂移自校正：当「已消耗计数」大于「完成基数」（多因历史数据迁移/重置/测试数据导致）时，
     完成新任务也看不到星星变化（被 max(0,…) 钉住）。
     此时改用「锚点法」：以最近一次摇骰记录里的 remain（摇完那一刻的真实余额）为基准，
     加上那之后新获得的星星——dayOps.at 晚于锚点 ts 的完成次数 + 锚点后的手工调星(extraLog star)。
     干净数据下 spent<=base，走原公式，行为与历史完全一致。 */
  const top = starLog.length ? starLog[0] : null;
  if(top && top.remain != null && spent > base){
    const anchorTs = Number(top.ts)||0;
    let after = 0;
    for(const t of tasks){
      if(!t) continue;
      const ops = (t.dayOps && typeof t.dayOps === 'object') ? t.dayOps : null;
      if(!ops) continue;
      for(const d in ops){ const o = ops[d]; if(o && Number(o.d)===1 && (Number(o.at)||0) > anchorTs) after++; }
    }
    let starAdj = 0;
    for(const r of extraLog){ if(r && r.kind==='star' && (Number(r.at)||0) > anchorTs) starAdj += (Number(r.delta)||0); }
    return Math.max(0, (Number(top.remain)||0) + after + starAdj);
  }
  return Math.max(0, base - spent);
}
/* 积分按「完成天数 × 每份分值」累计：周期任务每天完成各得 1 份（如 1~5 号每天完成、每份 1 分 = 5 分）；
   一次性任务最多完成 1 天 = 1 份。与分页统计 buildEarnedMap/todayEarnedInfo（按天归属）口径统一。
   撤销某天完成会减少对应天数，积分同步回退；兑换消耗（pending/approved）从余额中扣减。 */
function pointBalance(){ let s=0; for(const t of tasks){ s += taskPointsEarned(t); } s+=extra.points; s-=redeemed.reduce((s2,r)=>s2+((r.status==='pending'||r.status==='approved')?(Number(r.cost)||0):0),0); return s; }

function pendingCount(){ return redeemed.filter(r=>r.status==='pending').length; }

/* 学期维度：上学期 / 下学期（下学期复用上学期题库，可随时扩充） */
const SEMESTERS = ['上学期','下学期'];
function getBank(g, sem, sub){ return (BANK[g] && BANK[g][sub]) || []; }
function shuffle(arr){ const a=arr.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); const t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
function shuffleOptions(item){
  const idx = item.o.map((_,i)=>i);
  const sh = shuffle(idx);
  return { q:item.q, diff:item.diff, o: sh.map(i=>item.o[i]), a: sh.indexOf(item.a) };
}
/* 与 shuffleOptions 类似，但保留 item 上的其它字段（如 exp / img） */
function shuffleQ(item){
  const idx = item.o.map((_,i)=>i);
  const sh = shuffle(idx);
  const base = { q:item.q, diff:item.diff, o: sh.map(i=>item.o[i]), a: sh.indexOf(item.a) };
  for(const k in item){ if(!(k in base)) base[k] = item[k]; }
  return base;
}
/* 尝试把题目解析为「a 运算符 b = ?」形式的纯四则运算并求出正确值。
   仅覆盖小学单步加减乘除（如 “12 + 23 = ?” / “5 - 2 = ?”），应用题/语文/英语返回 null（无法程序校验，放行给上层）。 */
function tryMathCalc(qText){
  const m = String(qText).match(/^\s*\(?(\d+(?:\.\d+)?)\)?\s*([\+\-\*\/])\s*\(?(\d+(?:\.\d+)?)\)?\s*=\s*\??\s*$/);
  if(!m) return null;
  const x = parseFloat(m[1]), op = m[2], y = parseFloat(m[3]);
  let v;
  switch(op){
    case '+': v = x + y; break;
    case '-': v = x - y; break;
    case '*': v = x * y; break;
    case '/': v = (y !== 0) ? (x / y) : NaN; break;
    default: return null;
  }
  return isFinite(v) ? v : null;
}
/* 联网（大模型）题目的健壮性归一化：
   1) 选项必须全部不同，否则视为废题（避免“两个看起来都对”的混淆）；
   2) 答案下标必须合法；3) 选项洗牌，避免答案总在第 0 项；
   4) 纯算术题用程序重新复算——若模型把正确答案标错，整题判废并回退本地题库，保证答案严谨。
   返回归一化后的题目，或 null（废题，应丢弃）。 */
function normModelQ(q){
  if(!q || typeof q.q !== 'string' || !Array.isArray(q.o)) return null;
  const o = q.o.map(String);
  if(o.length < 2) return null;
  if(new Set(o).size !== o.length) return null;          // 选项重复 → 废题
  const a = Number(q.a);
  if(!(a >= 0 && a < o.length)) return null;             // 答案下标非法 → 废题
  const correct = tryMathCalc(q.q);
  if(correct !== null && String(correct) !== String(o[a])) return null;  // 算术题答案标错 → 废题
  return shuffleQ({ q:String(q.q), o, a, diff:String(q.diff||learnDiff), exp:String(q.exp||''), img:String(q.img||'') });
}

/* 日期工具：周视图（周一为一周开始） */
const WEEK_CN = ['周日','周一','周二','周三','周四','周五','周六'];
function fmtDate(d){ return d.getFullYear()+'年'+(d.getMonth()+1)+'月'+d.getDate()+'日'; }
function fmtISO(d){ const m=String(d.getMonth()+1).padStart(2,'0'), day=String(d.getDate()).padStart(2,'0'); return d.getFullYear()+'-'+m+'-'+day; }
function startOfWeek(offset){
  const d = new Date(); d.setHours(0,0,0,0);
  const dow = (d.getDay()+6)%7;            // 0=周一
  d.setDate(d.getDate()-dow + offset*7);
  return d;
}
function todayInfo(){
  const d = new Date(); d.setHours(0,0,0,0);
  return { date:d, iso:fmtISO(d), label: fmtDate(d)+' '+WEEK_CN[d.getDay()] };
}

/* 环形饼图（甜甜圈）SVG：已完成(绿) / 待完成(橙) / 已取消(灰) */
const DONUT = { done:'#5fb896', pend:'#fb8500', canc:'#a07a8a' };
function buildDonut(done, pend, canc, pct){
  const total = done + pend + canc;
  const R = 52, C = 2 * Math.PI * R;
  let segs = '';
  if(total > 0){
    const parts = [['done', done], ['pend', pend], ['canc', canc]];
    let acc = 0;
    parts.forEach(([k, v])=>{
      if(v <= 0) return;
      const frac = v / total;
      const len = frac * C;
      segs += `<circle class="donut-seg" cx="70" cy="70" r="${R}" stroke="${DONUT[k]}" stroke-dasharray="${len.toFixed(2)} ${(C-len).toFixed(2)}" stroke-dashoffset="${(-acc*C).toFixed(2)}" transform="rotate(-90 70 70)"></circle>`;
      acc += frac;
    });
  }
  const full = pct===100 ? 'full' : '';
  return `<svg class="donut" viewBox="0 0 140 140">
    <circle class="donut-track" cx="70" cy="70" r="${R}"></circle>
    ${segs}
    <text x="70" y="66" text-anchor="middle" class="donut-pct ${full}">${pct}%</text>
    <text x="70" y="86" text-anchor="middle" class="donut-label">完成</text>
  </svg>`;
}

/* 复用：生成一个"今日任务式"彩色方块（与首页今日任务样式一致）。
   date 为要判定完成态的目标日（Date 对象）；传 null 表示按整体 t.done 判定（用于一次性过期任务）。
   confirmMode=true 时，点击任务弹「完成/撤销」确认弹窗（首页今日任务用）；否则保持点击即切换。 */
function taskBlock(t, date, confirmMode, simple){
  const d = date || null;
  const isCancelled = !!t.cancelled;
  const isDone = !isCancelled && (d ? doneOnDay(t, d) : !!t.done);
  const b = document.createElement('div');
  b.className = `task-block ${t.timed?'has-timer':''} ${isDone?'done':''} ${isCancelled?'cancelled':''}`;
  b.style.background = taskColor(t);
  b.dataset.id = t.id;
  let timerHtml = '';
  if(t.timed && !isCancelled){
    if(isDone){
      timerHtml = `<div class="t-timer tb-timer"><span class="t-timer-ico">⏱️</span><span class="t-timer-val used">本次用时 ${formatElapsed(timerElapsed(t))}</span></div>`;
    } else {
      timerHtml = `<div class="t-timer tb-timer">
        <span class="t-timer-ico">⏱️</span>
        <span class="t-timer-val" data-timer="${t.id}">${formatElapsed(timerElapsed(t))}</span>
        <button class="icon-btn t-start ${t.timerStartAt?'on':''}" data-timerbtn="${t.id}" title="${t.timerStartAt?'暂停':'开始计时'}">${t.timerStartAt?'⏸️':'▶️'}</button>
        ${(t.timerStartAt || t.elapsed>0) ? `<button class="icon-btn t-end" data-timerend="${t.id}" title="结束">⏹</button>` : ''}
        ${t.elapsed>0 && !t.timerStartAt ? `<button class="icon-btn t-reset" data-timerreset="${t.id}" title="清零">↺</button>` : ''}
      </div>`;
    }
  }
  const metaParts = [];
  if(!simple){
    if(t.repeat && t.repeat !== 'once' && REPEATS[t.repeat]) metaParts.push(`<span class="tb-tag tb-rep">🔁 ${REPEATS[t.repeat]}</span>`);
    if(t.startDate || t.endDate){
      const s = t.startDate ? mdLabel(t.startDate) : '…';
      const e = t.endDate ? mdLabel(t.endDate) : '…';
      metaParts.push(`<span class="tb-tag tb-date">📅 ${s} – ${e}</span>`);
    }
  }
  const metaHtml = metaParts.length ? `<span class="tb-meta">${metaParts.join('')}</span>` : '';
  if(metaHtml) b.classList.add('has-meta');
  let doneTimeHtml = '';
  if(isDone){
    const p=n=>String(n).padStart(2,'0');
    if(t.doneAt){ const dt=new Date(t.doneAt); doneTimeHtml = `<span class="tb-done-time">🕐 ${p(dt.getHours())}:${p(dt.getMinutes())}</span>`; }
    else if(t.doneDate){ const dd=new Date(String(t.doneDate).replace(/-/g,'/')); doneTimeHtml = `<span class="tb-done-time">🕐 ${dd.getFullYear()}年${p(dd.getMonth()+1)}月${p(dd.getDate())}日</span>`; }
  }
  if(doneTimeHtml) b.classList.add('has-time');
  // 左上角状态角标：未完成=红色叹号❗、已完成=对勾圆圈☑️、已取消=灰✕
  const flagCls = isDone?'ok':(isCancelled?'canc':'todo');
  const flagTxt = isDone?'✓':(isCancelled?'✕':'!');
  b.innerHTML = `<span class="tb-flag ${flagCls}">${flagTxt}</span><span class="tb-name">${esc(t.title)}</span>` + metaHtml + timerHtml + doneTimeHtml;
  if(!isCancelled){
    const tb = b.querySelector('[data-timerbtn]');
    if(tb) tb.onclick = (e)=>{ e.stopPropagation(); toggleTaskTimer(t); };
    const te = b.querySelector('[data-timerend]');
    if(te) te.onclick = (e)=>{ e.stopPropagation(); endTaskTimer(t); };
    const tr = b.querySelector('[data-timerreset]');
    if(tr) tr.onclick = (e)=>{ e.stopPropagation(); resetTaskTimer(t); };
  }
  const doComplete = ()=>{
    settleTaskTimer(t);
    setTaskDayDone(t, d ? fmtISO(d) : null, true);   // 按天记录「完成」
    setTaskCancel(t, false, t.reason || '');
    save(); render(); showEncourage(t); refreshBadges();
  };
  const doUncomplete = ()=>{
    // 撤销完成：按天记录「撤销」，其余天的完成历史保留；该撤销会同步到其它设备
    setTaskDayDone(t, d ? fmtISO(d) : null, false);
    setTaskCancel(t, false, t.reason || '');
    save(); render();
  };
  b.onclick = ()=>{
    if(isCancelled) return;
    const blkMsg = taskDoneBlockMsg(t, d);
    if(blkMsg){ showToast(blkMsg); return; }
    if(confirmMode){
      const doneNow = d ? doneOnDay(t, d) : !!t.done;
      if(!doneNow){
        const pts = (t.points && t.points>0) ? ` +${t.points} 积分` : '积分';
        confirmModal({ title:'🎉 完成这个任务？', message:`「${t.title}」完成啦！可获得 ${pts}，确定完成吗？`, confirmText:'确认完成', onConfirm: doComplete });
      } else {
        confirmModal({ title:'↩️ 撤销完成？', message:`要取消「${t.title}」的完成状态吗？`, confirmText:'撤销', cancelText:'再想想', danger:true, onConfirm: doUncomplete });
      }
      return;
    }
    if(d){
      if(!doneOnDay(t, d)){ doComplete(); }
      else { doUncomplete(); }
    } else {
      if(!t.done){ doComplete(); }
      else { doUncomplete(); }
    }
  };
  return b;
}

/* 首页底部「未完成任务」列表的未完成时间：单次任务显示其应完成日期，区间任务显示起止 */
function odTimeLabel(t){
  const s = mdLabel(t.startDate || t.deadline);
  if(t.endDate && t.endDate !== (t.startDate || t.deadline)) return s + ' – ' + mdLabel(t.endDate);
  return s;
}
/* 是否已超过完成时间（过期未完成）：单次任务按应完成日/区间结束日判定；重复任务不判过期 */
function isOverdueTask(t){
  if(!t || t.done || t.cancelled) return false;
  if(t.repeat && t.repeat !== 'once') return false;
  const dueEnd = t.endDate || t.deadline;
  return !!dueEnd && dueEnd < todayInfo().iso;
}
/* 仅当天任务可完成：返回 null 表示可完成，否则返回不可完成的提示文案。
   d 为点击所在面板的日期（Date），null 表示任务级入口（我的任务/计时结束/首页过期列表） */
function taskDoneBlockMsg(t, d){
  if(!t || t.done || t.cancelled) return null;
  const today = todayInfo();
  if(isOverdueTask(t)) return '⏰ 已超过完成时间，不能补完成啦～';
  if(d){
    const targetISO = fmtISO(d);
    if(targetISO !== today.iso){
      return (targetISO < today.iso)
        ? '⏰ 只能当天完成任务哦～'
        : '⏳ 还没到任务日期，不能提前完成哦～';
    }
  } else {
    // 任务级入口：按任务自身日期判断过去/未来
    const dueEnd = t.endDate || t.deadline;
    if(dueEnd && dueEnd > today.iso) return '⏳ 还没到任务日期，不能提前完成哦～';
  }
  if(!taskMatchesDate(t, today.date)) return '⏰ 只能当天完成任务哦～';
  return null;
}
/* 首页「未完成任务」面板：切换「近30天/全部」后局部刷新列表并自动折叠 */
function refreshOverduePanel(){
  const op = document.querySelector('.home-overdue');
  if(!op) return;
  const overdueAll = tasks.filter(t=>taskVisible(t) && isOverdueTask(t));
  const cutoff = new Date(); cutoff.setDate(cutoff.getDate()-30);
  const cutoffISO = fmtISO(cutoff);
  const overdue = (overdueScope==='all') ? overdueAll : overdueAll.filter(t=> (t.endDate||t.deadline) >= cutoffISO);
  const head = document.getElementById('overdueHead');
  if(head){ const t = head.querySelector('.ch-title'); if(t) t.textContent = '⏰ 未完成任务（'+overdue.length+'）'; }
  const s30 = document.getElementById('odScope30'); if(s30) s30.classList.toggle('on', overdueScope===30);
  const sAll = document.getElementById('odScopeAll');
  if(sAll){ sAll.classList.toggle('on', overdueScope==='all'); sAll.textContent = '全部（'+overdueAll.length+'）'; }
  const body = op.querySelector('.collapse-body');
  if(body){
    const oldTable = body.querySelector('.od-table');
    const oldEmpty = body.querySelector('.od-empty');
    if(overdue.length){
      if(oldEmpty) oldEmpty.remove();
      let table = oldTable;
      if(!table){
        table = document.createElement('div');
        table.className = 'od-table';
        table.innerHTML = `<div class="od-row od-head"><span class="od-name">任务</span><span class="od-time">未完成时间</span></div>`;
        const scope = body.querySelector('.od-scope');
        if(scope) scope.after(table); else body.appendChild(table);
      }
      table.querySelectorAll('.od-item').forEach(r=>r.remove());
      overdue.forEach(t=>{
        const row = document.createElement('div');
        row.className = 'od-row od-item';
        row.dataset.id = t.id;
        row.innerHTML = `<span class="od-name">${esc(t.title)}</span><span class="od-time">${odTimeLabel(t)}</span>`;
        row.onclick = ()=>{ const blkMsg = taskDoneBlockMsg(t, null); if(blkMsg) showToast(blkMsg); };
        table.appendChild(row);
      });
    } else {
      if(oldTable) oldTable.remove();
      if(!oldEmpty){
        const p = document.createElement('p');
        p.className = 'od-empty';
        p.textContent = '近 30 天没有过期任务～（可切换到「全部」查看更早的）';
        const scope = body.querySelector('.od-scope');
        if(scope) scope.after(p); else body.appendChild(p);
      }
    }
  }
  // 展开/折叠仅由面板标题（箭头）控制，范围切换不改变折叠状态
}

/* 联网（大模型）生成一条适龄正向知识（type='history' 趣味历史 / 'story' 历史故事 / 其他 科普），失败返回 null */
async function genKnowledgeOnline(g, type){
  const gcn = Number(g||1);
  const age = 6 + (isNaN(gcn)?0:(gcn-1));
  let p;
  if(type==='history'){
    p = `请为一名${gcn}年级（约${age}岁）的中国小学生准备一条「趣味历史知识」。要求：积极、正向、适合儿童的历史趣闻，可以讲古代发明、古代生活、著名人物的正面事迹、名胜古迹由来、有趣的历史冷知识等；绝对避免战争、暴力、政治、灾难、恐怖、负面人物与负面内容；用生动有趣、孩子能听懂的话讲清楚。只返回 JSON：{"title":"短标题（不超过14个字）","body":"80-140字的通俗讲解","question":"一个能引发孩子思考的小问题"}。不要任何解释或多余文字。`;
  } else if(type==='story'){
    p = `请为一名${gcn}年级（约${age}岁）的中国小学生讲一个「历史小故事」。要求：选一个真实、积极、正向的中国历史故事或名人小故事（如司马光砸缸、曹冲称象、铁杵磨成针、大禹治水等），用讲故事的口吻讲完整（有起因、经过、结果），孩子能听懂；绝对避免战争、暴力、政治、灾难、恐怖、负面人物与负面内容。只返回 JSON：{"title":"故事标题（不超过14个字）","body":"80-140字的故事讲述","question":"一个能引发孩子思考的小问题"}。不要任何解释或多余文字。`;
  } else {
    p = `请为一名${gcn}年级（约${age}岁）的中国小学生准备一条「每日新知」。要求：积极、正向、适合儿童的科普或生活常识；绝对避免任何政治、灾难、暴力、恐怖、成人或负面新闻内容；用生动有趣、孩子能听懂的话讲清楚。只返回 JSON：{"title":"短标题（不超过14个字）","body":"80-140字的通俗讲解","question":"一个能引发孩子思考的小问题"}。不要任何解释或多余文字。`;
  }
  try{ const out = await llmChat(p, 0.85); const o = (typeof out==='string')?JSON.parse(out):out; if(o&&typeof o.title==='string'&&o.title.trim()&&typeof o.body==='string'&&o.body.trim()) return { title:o.title.trim(), body:o.body.trim(), question: (typeof o.question==='string'&&o.question.trim())?o.question.trim():'' }; }catch(e){ console.warn('知识联网获取失败：', e); } return null;
}

/* ============ 闯关冒险地图（旧实现，已改版为每日知识） ============ */
function todayAdventureTasks(){
  const today = todayInfo();
  return tasks.filter(t=> taskVisible(t) && taskMatchesDate(t, today.date));

function buildAdventureSvg(td, date){
  const n = td.length;
  const W = 360, H = Math.max(360, 90 + n*96);
  const leftX = 78, rightX = 282, topY = 70, botY = H - 70;
  const step = n>1 ? (botY - topY)/(n-1) : 0;
  const pts = td.map((t,i)=>({
    x: (i%2===0) ? leftX : rightX,
    y: topY + step*i,
    done: doneOnDay(t, date),
    t
  }));
  // 整条浅色小路
  let dPath = '';
  pts.forEach((p,i)=>{
    if(i===0){ dPath += `M ${p.x} ${p.y} `; }
    else { const prev = pts[i-1]; dPath += `C ${prev.x} ${prev.y + step*0.5}, ${p.x} ${p.y - step*0.5}, ${p.x} ${p.y} `; }
  });
  let svg = `<svg class="adv-svg" viewBox="0 0 ${W} ${H}" width="100%" preserveAspectRatio="xMidYMin meet" aria-label="冒险地图">`;
  svg += `<defs><linearGradient id="advGold" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#ffe08a"/><stop offset="100%" stop-color="#ffb347"/></linearGradient></defs>`;
  svg += `<path d="${dPath}" class="adv-road" fill="none" stroke="#ead9f2" stroke-width="14" stroke-linecap="round" stroke-dasharray="2 16"/>`;
  // 已点亮路段：金色实线（从起点连到第一个未完成的节点为止）
  let litEnd = -1;
  for(let i=0;i<n;i++){ if(pts[i].done) litEnd=i; else break; }
  if(litEnd>=0){
    let lit = '';
    for(let i=0;i<=litEnd;i++){
      if(i===0) lit += `M ${pts[i].x} ${pts[i].y} `;
      else { const prev = pts[i-1]; lit += `C ${prev.x} ${prev.y + step*0.5}, ${pts[i].x} ${pts[i].y - step*0.5}, ${pts[i].x} ${pts[i].y} `; }
    }
    svg += `<path d="${lit}" fill="none" stroke="url(#advGold)" stroke-width="8" stroke-linecap="round"/>`;
  }
  // 节点
  pts.forEach((p,i)=>{
    const isCanc = !!p.t.cancelled;
    const fill = isCanc ? '#dcd6dd' : (p.done ? 'url(#advGold)' : '#ffffff');
    const stroke = isCanc ? '#bdb4bf' : (p.done ? '#f4a93c' : '#cdbce0');
    const ico = isCanc ? '✕' : (p.done ? '🌟' : (i+1));
    svg += `<g class="adv-node ${p.done?'on':''}" data-tid="${p.t.id}" transform="translate(${p.x},${p.y})">
      <circle r="26" fill="${fill}" stroke="${stroke}" stroke-width="5"/>
      <text class="adv-node-ico" y="8" text-anchor="middle">${ico}</text>
      <text class="adv-node-cap" y="46" text-anchor="middle">${esc(p.t.title).slice(0,7)}</text>
    </g>`;
  });
  // 终点宝箱（与最后一个节点异侧）
  const lastX = pts[n-1].x;
  const ex = (lastX===leftX) ? rightX : leftX;
  const ey = botY + 38;
  const chestOpen = n>0 && pts.every(p=>p.done);
  svg += `<g class="adv-end ${chestOpen?'on':''}" transform="translate(${ex},${ey})">
    <circle r="30" fill="${chestOpen?'url(#advGold)':'#fff'}" stroke="${chestOpen?'#f4a93c':'#cdbce0'}" stroke-width="5"/>
    <text class="adv-node-ico" y="9" text-anchor="middle">${chestOpen?'🎉':'🎁'}</text>
    <text class="adv-node-cap" y="52" text-anchor="middle">宝箱</text>
  </g>`;
  svg += `</svg>`;
  return svg;
}

      <div class="know-search-row"><button class="know-search-mini" id="knowSearchBtn" title="直接用这个问题提问">🔍 搜搜看</button></div>
      <div class="know-answer" id="knowAnswer" style="display:none"></div>` : ''}
    <div class="girl-actions know-acts">
      ${item && !knowledgeState.loading ? `<button class="btn primary" id="knowNext">🎲 换一条新知</button>` : ''}
    </div>
  `;

  const nextBtn = document.getElementById('knowNext');
  if(nextBtn) nextBtn.onclick = ()=>{ knowledgeState.item=null; ensureKnowledge(true); };
  // 小搜索按钮：直接用当前问题提问，大模型通俗回答（联网不可用时给友好提示）
  const searchBtn = document.getElementById('knowSearchBtn');
  const answerBox = document.getElementById('knowAnswer');
  const doKnowledgeSearch = async ()=>{
    if(!item || searchBtn.disabled) return;
    const q = item.question || item.title;
    if(!q){ showToast('这条知识暂时没有可搜索的问题哦～'); return; }

      ans = (out && typeof out.answer==='string') ? out.answer.trim() : '';
    }catch(e){ console.warn('知识搜索失败：', e); }
    searchBtn.disabled = false;
    if(ans){
      if(answerBox) answerBox.innerHTML = `<div class="know-answer-txt">💡 <b>小提示：</b>${esc(ans)}</div>`;
    } else {
      if(answerBox) answerBox.innerHTML = `<div class="know-answer-fail">😢 网络或模型暂时不可用，可以问问爸爸妈妈，或换个问题再试试～</div>`;

  };
  if(searchBtn) searchBtn.onclick = doKnowledgeSearch;
  const tabS = document.getElementById('knowTabScience');
  if(tabS) tabS.onclick = ()=>{ if(knowledgeType==='science' || knowledgeState.loading) return; knowledgeType='science'; saveKnowledgeType('science'); knowledgeState.item=null; ensureKnowledge(false); };
  const tabH = document.getElementById('knowTabHistory');
  if(tabH) tabH.onclick = ()=>{ if(knowledgeType==='history' || knowledgeState.loading) return; knowledgeType='history'; saveKnowledgeType('history'); knowledgeState.item=null; ensureKnowledge(false); };
  const tabSt = document.getElementById('knowTabStory');
  if(tabSt) tabSt.onclick = ()=>{ if(knowledgeType==='story' || knowledgeState.loading) return; knowledgeType='story'; saveKnowledgeType('story'); knowledgeState.item=null; ensureKnowledge(false); };
}

/* ---- 完成勋章统计口径（与积分/星星同源，全部基于 dayOps 真相 taskDoneDays） ---- */
function totalDoneAll(){ let s=0; tasks.forEach(t=>{ try{ s+=taskDoneCount(t); }catch(e){} }); return s; }
function doneCountType(tp){ let s=0; tasks.forEach(t=>{ if(t && t.type===tp){ try{ s+=taskDoneCount(t); }catch(e){} } }); return s; }
function doneCountOnDay(iso){ let n=0; tasks.forEach(t=>{ try{ if(taskDoneDays(t).indexOf(iso)>=0) n++; }catch(e){} }); return n; }
function doneBestDay(){ let best=0; const days={}; tasks.forEach(t=>{ try{ taskDoneDays(t).forEach(d=>{ days[d]=(days[d]||0)+1; }); }catch(e){} }); for(const k in days){ if(days[k]>best) best=days[k]; } return best; }
function doneLast7(){ let n=0; for(let i=0;i<7;i++){ const d=new Date(); d.setDate(d.getDate()-i); n+=doneCountOnDay(fmtISO(d)); } return n; }
function doneRunDays(){
  /* 连续完成天数：从今天往回数每天都有完成；今天还没完成则从昨天开始数（不算断签） */
  let start = doneCountOnDay(fmtISO(new Date())) > 0 ? 0 : 1;
  let run = 0;
  for(let i=start;i<400;i++){ const d=new Date(); d.setDate(d.getDate()-i); if(doneCountOnDay(fmtISO(d))>0) run++; else break; }
  return run;
}

let brainIdx = 0;
let brainRevealed = false;
let brainStarted = false;   // 每次进入该游戏随机起点
let brainOnline = [];        // 联网补充的脑筋急转弯（按当前年级缓存）
let brainOnlineLoading = false;
let brainOnlineGrade = null; // 当前联网题库对应的年级（切换年级时失效重拉）
let brainMode = localStorage.getItem('kidtask_brainmode_v1') || 'local';   // 'local' 直接本地 / 'online' 联网出题
async function loadBrainOnline(){
  if(brainMode!=='online') return;
  if(brainOnline.length && brainOnlineGrade===grade) return;   // 已有当前年级的联网题，无需重拉
  if(brainOnlineLoading || !grade) return;
  brainOnlineLoading = true;
  try{
    const prompt = `你是一位有趣的儿童脑筋急转弯出题官。请出 10 道适合小学${grade}年级孩子、中文、积极健康、无恐怖暴力内容的脑筋急转弯。
要求：每道包含 q（问题）和 a（有趣答案）；只返回 JSON，不要解释、不要 markdown 代码块。
格式严格如下：{"teasers":[{"q":"问题文字","a":"答案文字"}, ...]}，teasers 数组长度正好为 10。`;
    const out = await llmJson(prompt);
    if(out && Array.isArray(out.teasers)){
      const good = out.teasers
        .filter(t => t && typeof t.q==='string' && t.q.trim() && typeof t.a==='string' && t.a.trim())
        .map(t => ({ q: t.q.trim(), a: t.a.trim() }));
      if(good.length){ brainOnline = good; brainOnlineGrade = grade; }
    }
  }catch(e){ console.warn('脑筋急转弯联网出题失败，沿用本地题库：', e); }
  finally{ brainOnlineLoading = false; }
}
function brainQuestions(){
  if(brainMode==='online'){
    if(brainOnline.length && brainOnlineGrade===grade) return brainOnline;
    return [];   // 联网模式但还没拉到题（renderBrain 会触发拉取）
  }
  return (BRAIN_TEASERS[grade] || BRAIN_TEASERS['1']);
}
function renderBrainLoading(){
  main.innerHTML = `
    <div class="page-head"><h1 class="page-title">💭 脑筋急转弯</h1><button class="back-btn" id="brainBack">‹ 返回</button></div>
    <p class="page-sub">🧩 这是给 ${gradeName(grade)} 准备的小脑筋，转一转，越玩越聪明！正在联网出题，请稍候～</p>
    <div class="brain-card">
      <div class="brain-emoji">🤖</div>
      <div class="brain-q">${getProvider().emoji} 正在用 ${getProvider().name} 联网出题…</div>
      <div class="brain-actions"><button class="btn" disabled>⏳ 请稍候</button></div>
    </div>`;
  const back = main.querySelector('#brainBack');
  if(back) back.onclick = ()=>{ brainStarted=false; brainRevealed=false; activeGame=null; renderGames(); window.scrollTo(0,0); };
}
function renderBrain(){
  // 联网出题模式：尚未拉到当前年级的题 -> 触发拉取并显示加载态，拉取完成后再渲染
  if(brainMode==='online' && !(brainOnline.length && brainOnlineGrade===grade) && !brainOnlineLoading){
    renderBrainLoading();
    loadBrainOnline().then(()=>{
      if(activeGame!=='brain') return;
      if(!(brainOnline.length && brainOnlineGrade===grade)){
        brainMode='local'; localStorage.setItem('kidtask_brainmode_v1','local');
        showToast('⚠️ 联网出题未成功，已用本地题库');
      }
      renderBrain();
    });
    return;
  }
  const qs = brainQuestions();
  if(!brainStarted){ brainStarted = true; brainIdx = Math.floor(Math.random()*Math.max(qs.length,1)); }
  const onlineCnt = brainOnline.length;
  const qsCount = qs.length;
  const statusLine = (brainMode==='online' && onlineCnt)
    ? `<span class="brain-net">🌐 已联网出 ${onlineCnt} 道（由 ${getProvider().emoji}${getProvider().name} 生成，随机抽题）</span>`
    : `<span class="brain-net">📚 本地 ${qsCount} 道（千问/DeepSeek 题库）</span>`;
  const q = qs[brainIdx % qs.length] || { q:'（暂无题目，换个方式试试～）', a:'' };
  main.innerHTML = `
    <div class="page-head"><h1 class="page-title">💭 脑筋急转弯</h1><button class="back-btn" id="brainBack">‹ 返回</button></div>
    <div class="en-modebar">
      <span class="ob-label">出题方式：</span>
      <div class="mode-seg" id="brainModeSeg">
        <button class="mode-btn ${brainMode==='local'?'sel':''}" data-m="local">📚 直接本地</button>
        <button class="mode-btn ${brainMode==='online'?'sel':''}" data-m="online">🤖 联网出题</button>
      </div>
      ${brainMode==='online' ? `<span class="ob-label">（由 ${getProvider().emoji}${getProvider().name} 联网生成）</span>` : ''}
    </div>
    <p class="page-sub">🧩 这是给 ${gradeName(grade)} 准备的小脑筋，转一转，越玩越聪明！每次随机抽一道题～ ${statusLine}</p>
    <div class="brain-card">
      <div class="brain-emoji">🧩</div>
      <div class="brain-q">${esc(q.q)}</div>
      ${brainRevealed ? `<div class="brain-a">💡 答案：${esc(q.a)}</div>` : ''}
      <div class="brain-actions">
        ${brainRevealed ? '' : `<button class="btn primary" id="brainReveal">👀 看答案</button>`}
        <button class="btn" id="brainNext">➡️ 下一题</button>
        <button class="btn" id="brainShuffle">🎲 换一题</button>
      </div>
      <p class="brain-tip">${brainRevealed ? '猜对了吗？猜对了给自己鼓个掌👏，答错也没关系，记住答案下次就知道啦！' : '先自己想一想哦，实在想不出再看答案～'}</p>
    </div>`;
  const back = main.querySelector('#brainBack');
  if(back) back.onclick = ()=>{ brainStarted=false; brainRevealed=false; activeGame=null; renderGames(); window.scrollTo(0,0); };
  const rev = main.querySelector('#brainReveal');
  if(rev) rev.onclick = ()=>{ brainRevealed=true; extra.points += 1; saveExtra(); addExtraRecord('points', 1, '脑筋急转弯'); showToast('💡 看答案啦，+1 积分，爱动脑筋的你真棒！'); renderBrain(); lockReturn(3); };
  const nx = main.querySelector('#brainNext');
  if(nx) nx.onclick = ()=>{ brainIdx = (brainIdx+1) % qs.length; brainRevealed=false; renderBrain(); };
  const sh = main.querySelector('#brainShuffle');
  if(sh) sh.onclick = ()=>{ if(qs.length>1){ let k=brainIdx; while(k===brainIdx){ k=Math.floor(Math.random()*qs.length); } brainIdx=k; } brainRevealed=false; renderBrain(); };
  const bseg = main.querySelector('#brainModeSeg');
  if(bseg){
    bseg.querySelectorAll('.mode-btn').forEach(b=>{
      b.onclick = ()=>{
        const m = b.dataset.m;
        if(m===brainMode) return;
        brainMode = m; localStorage.setItem('kidtask_brainmode_v1', brainMode);
        brainRevealed=false; brainStarted=false;   // 重新随机起点
        renderBrain();
      };
    });
  }
}

function idiomShuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); const t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
function idiomPickStarter(){ const ok = IDIOM_STARTERS.filter(w=>{ const h=IDIOM_HINT[w.slice(-1)]; return h && h.length; }); const pool = ok.length ? ok : IDIOM_STARTERS; return pool[Math.floor(Math.random()*pool.length)]; }
function loadScene(){
  const bank = SCENE_IDIOMS[grade] || SCENE_IDIOMS['1'];
  const item = bank[sceneIdx % bank.length];
  sceneOpts = idiomShuffle(item.opts.slice());
  scenePick = -1; sceneDone = false;
}
function loadCloze(){
  const bank = CLOZE_IDIOMS[grade] || CLOZE_IDIOMS['1'];

function startClozeVoice(){
  if(!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)){
    clozeVoiceStatus = '当前浏览器不支持语音识别，请直接点选答案～'; renderIdiomCloze(); return;
  }
  if(clozeDone){ clozeVoiceStatus='本题已经完成啦，换一题再试语音吧～'; renderIdiomCloze(); return; }
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const rec = new SR();
  idiomRec = rec;
  const bank = CLOZE_IDIOMS[grade] || CLOZE_IDIOMS['1'];
  const item = bank[clozeIdx % bank.length];
  const correct = item.idiom[item.blank];
  rec.lang = 'zh-CN';
  rec.interimResults = false;
  rec.maxAlternatives = 1;
  const btnEl = main.querySelector('#clozeVoice');
  const statusEl = main.querySelector('#clozeVoiceStatus');
  if(btnEl){ btnEl.classList.add('listening'); btnEl.textContent='🎙️ 聆听中…'; }
  if(statusEl) statusEl.textContent = '请说出这个字，例如「' + correct + '」';
  if(statusEl) statusEl.classList.remove('err');
  rec.onresult = (e)=>{
    const raw = (e.results && e.results[0] && e.results[0][0] && e.results[0][0].transcript) || '';
    const txt = raw.replace(/[\s，。、！？,.!?]/g,'');
    const ok = (txt === correct) || txt.includes(correct) || (txt === item.idiom);
    if(idiomRec){ try{ idiomRec.stop(); }catch(_){} idiomRec = null; }
    resetVoiceBtn();
    if(ok){
      const idx = clozeOpts.indexOf(correct);
      if(idx >= 0) clozePick = idx;
      clozeDone = true; clozeVoiceOk = true; clozeVoiceStatus = '语音识别：『' + raw.trim() + '』✓';
      if(idx >= 0 && clozeOpts[idx] === correct){ extra.points += 2; saveExtra(); addExtraRecord('points', 2, '成语填空(语音)'); showToast('✏️ 语音答对啦 +2 积分！'); }
      else { showToast('✏️ 答对啦！'); }
    } else {
      clozeVoiceStatus = '听到：「' + raw.trim() + '」好像不对，再试一次，或直接点选答案～';
      showToast('再想想，听听正确答案～');
    }
    renderIdiomCloze();
  };
  rec.onerror = (e)=>{
    let msg = '语音识别出错了，请点选答案或重试～';
    if(e.error === 'not-allowed' || e.error === 'service-not-allowed') msg = '麦克风权限被拒绝，请在浏览器允许使用麦克风，或直接点选答案～';
    else if(e.error === 'no-speech') msg = '没有听到声音，请再试一次，或直接点选答案～';
    else if(e.error === 'audio-capture') msg = '没有检测到麦克风，请直接点选答案～';
    clozeVoiceStatus = msg; idiomRec = null; resetVoiceBtn(); renderIdiomCloze();
  };
  rec.onend = ()=>{ idiomRec = null; resetVoiceBtn(); };
  try{ rec.start(); }catch(err){ clozeVoiceStatus='无法启动语音，请直接点选答案～'; idiomRec=null; resetVoiceBtn(); renderIdiomCloze(); }
}

  return `<svg viewBox="${pic.vb}" class="color-pic-svg" xmlns="http://www.w3.org/2000/svg">${inner}</svg>`;
}

function setupDraw(){
  const cv = main.querySelector('#drawCanvas'); if(!cv || !cv.isConnected) return;
  const ctx = cv.getContext('2d'); if(!ctx) return; ctx.lineCap='round'; ctx.lineJoin='round';
  let drawing=false, last=null, brush=6;
  const pos = e=>{ const r=cv.getBoundingClientRect(); const t=e.touches?e.touches[0]:e; return { x:(t.clientX-r.left)*(cv.width/r.width), y:(t.clientY-r.top)*(cv.height/r.height) }; };
  const down = e=>{ if(!cv.isConnected) return; e.preventDefault(); drawing=true; last=pos(e); };
  const move = e=>{ if(!drawing||!cv.isConnected) return; e.preventDefault(); const p=pos(e); ctx.globalCompositeOperation = brush===0?'destination-out':'source-over'; ctx.strokeStyle=colorCur; ctx.lineWidth=brush===0?26:brush; ctx.beginPath(); ctx.moveTo(last.x,last.y); ctx.lineTo(p.x,p.y); ctx.stroke(); last=p; };
  const up = ()=>{ drawing=false; };
  cv.addEventListener('mousedown',down); cv.addEventListener('mousemove',move); window.addEventListener('mouseup',up);
  cv.addEventListener('touchstart',down,{passive:false}); cv.addEventListener('touchmove',move,{passive:false}); cv.addEventListener('touchend',up);

      else if(activeGame==='challenge') renderChallenge();
    }
  });
} catch(e){}
function renderChallenge(){

      return `<div class="chal-item">

        <div class="chal-prog"><div class="chal-fill" style="width:${pct}%"></div></div>

    </div>`;
  main.innerHTML = html;

  main.querySelectorAll('[data-cstep]').forEach(b=> b.onclick = ()=>{ const c=challenges.find(x=>x.id===b.dataset.cstep); if(c&&c.status==='active'){ c.kid++; if(c.kid>=c.target) c.status='done'; saveChals(); renderChallenge(); } });
  const cn = main.querySelector('#chalNew'); if(cn) cn.onclick = ()=>{ const f=main.querySelector('#chalForm'); if(f) f.style.display = f.style.display==='none'?'flex':'none'; };
  const ca = main.querySelector('#chalAdd'); if(ca) ca.onclick = ()=>{

/* ============================================================
   新增模块 2：休闲小游戏（casual）—— 翻牌配对 + 找不同
   ============================================================ */
let casualMode = 'mem';
let memState = null;
let findState = null;
let puzState = null;
let m3State = null;
let fruitState = null;
let fruitTimer = null;
function stopFruit(){ if(fruitTimer){ cancelAnimationFrame(fruitTimer); fruitTimer=null; } }
const MEM_EMOJI = ['🍎','🍌','🌟','🐱','🌸','🐰','🍉','🎈','🦄','🍓'];
function startMem(){ const pick = kkShuffle(MEM_EMOJI).slice(0,6); memState = { deck: kkShuffle([...pick,...pick]), up:new Array(12).fill(false), matched:new Array(12).fill(false), first:-1, lock:false, moves:0, done:false }; }
function startFind(){ const base = kkShuffle(MEM_EMOJI).slice(0,6); const idx = kkRand(6); const rep = kkShuffle(MEM_EMOJI.filter(x=>x!==base[idx]))[0]; const bottom = base.slice(); bottom[idx]=rep; findState = { top:base, bottom, idx, solved:false }; }
function renderCasual(){
  main.innerHTML = `
    <div class="page-head"><h1 class="page-title">🎲 休闲小游戏</h1><button class="back-btn" id="casBack">‹ 返回</button></div>
    <p class="page-sub">翻牌配对、找不同，越玩越聪明～</p>
    <div class="mod-wrap">
      <div class="mod-tabs">
        <button class="mod-tab${casualMode==='mem'?' sel':''}" data-cm="mem">🃏 翻牌配对</button>
        <button class="mod-tab${casualMode==='find'?' sel':''}" data-cm="find">🔍 找不同</button>
        <button class="mod-tab${casualMode==='puzzle'?' sel':''}" data-cm="puzzle">🧩 拼图</button>
        <button class="mod-tab${casualMode==='match3'?' sel':''}" data-cm="match3">✨ 消消乐</button>
        <button class="mod-tab${casualMode==='fruit'?' sel':''}" data-cm="fruit">🍎 接水果</button>
      </div>
      ${casualMode==='mem' ? renderMem() : casualMode==='find' ? renderFind() : casualMode==='puzzle' ? renderPuzzle() : casualMode==='match3' ? renderMatch3() : renderFruit()}
    </div>`;
  const back = main.querySelector('#casBack'); if(back) back.onclick = ()=>{ stopFruit(); activeGame=null; renderGames(); window.scrollTo(0,0); };
  main.querySelectorAll('[data-cm]').forEach(b=> b.onclick = ()=>{
    if(casualMode==='fruit') stopFruit();
    casualMode=b.dataset.cm;
    if(casualMode==='mem'&&!memState) startMem();
    if(casualMode==='find'&&!findState) startFind();
    if(casualMode==='puzzle'&&!puzState) startPuzzle();
    if(casualMode==='match3'&&!m3State) startMatch3();
    renderCasual();
  });
  if(casualMode==='mem') bindMem();
  else if(casualMode==='find') bindFind();
  else if(casualMode==='puzzle') bindPuzzle();
  else if(casualMode==='match3') bindMatch3();
  else bindFruit();
}
function renderMem(){
  if(!memState) startMem();
  const cards = memState.deck.map((e,i)=>{
    const cls = 'mem-card' + (memState.matched[i]?' matched':(memState.up[i]?' up':''));
    const face = (memState.up[i]||memState.matched[i]) ? e : '❓';
    return `<div class="${cls}" data-mi="${i}">${face}</div>`;
  }).join('');
  const left = memState.matched.filter(Boolean).length/2;
  return `<div class="mod-card"><div class="mem-grid">${cards}</div><div class="study-score"><div>配对 <b>${left}</b>/6</div><div>步数 <b>${memState.moves}</b></div>${memState.done?'<div>🎉 完成！</div>':''}</div><div class="girl-actions" style="justify-content:center"><button class="btn" id="memRestart">🔄 重新开始</button></div></div>`;
}
function bindMem(){
  const rs = main.querySelector('#memRestart'); if(rs) rs.onclick = ()=>{ startMem(); renderCasual(); };
  main.querySelectorAll('[data-mi]').forEach(c=> c.onclick = ()=>{
    const i = Number(c.dataset.mi); if(memState.lock||memState.matched[i]||memState.up[i]) return;
    memState.up[i]=true;
    if(memState.first===-1){ memState.first=i; renderCasual(); return; }
    memState.moves++;
    const a=memState.first, b=i;
    if(memState.deck[a]===memState.deck[b]){ memState.matched[a]=memState.matched[b]=true; memState.first=-1; if(memState.matched.every(Boolean)) memState.done=true; renderCasual(); }
    else { memState.lock=true; renderCasual(); setTimeout(()=>{ memState.up[a]=memState.up[b]=false; memState.first=-1; memState.lock=false; renderCasual(); }, 700); }
  });
}
function renderFind(){
  if(!findState) startFind();
  const top = findState.top.map(e=>`<div class="find-cell">${e}</div>`).join('');
  const bot = findState.bottom.map((e,i)=> `<div class="find-cell${findState.solved&&i===findState.idx?' hit':''}" data-fi="${i}">${e}</div>`).join('');
  return `<div class="mod-card"><p style="text-align:center;font-size:15px;color:#7a3a5a;font-weight:700">上面和下面有两处不一样，找出下面不同的那个吧！</p><div class="find-row">${top}</div><div class="find-row">${bot}</div>${findState.solved?'<div class="study-score" style="justify-content:center"><b>🎉 你找到了！</b></div><div class="girl-actions" style="justify-content:center"><button class="btn" id="findNext">➡️ 再来一张</button></div>':''}</div>`;
}
function bindFind(){
  const nx = main.querySelector('#findNext'); if(nx) nx.onclick = ()=>{ startFind(); renderCasual(); };
  main.querySelectorAll('[data-fi]').forEach(c=> c.onclick = ()=>{
    if(findState.solved) return;
    const i = Number(c.dataset.fi);
    if(i===findState.idx){ findState.solved=true; renderCasual(); }
    else { c.classList.add('miss'); showToast('再看看～'); setTimeout(()=> c.classList.remove('miss'), 500); }
  });
}

function startPuzzle(){

  do { order = kkShuffle([0,1,2,3,4,5,6,7,8]); } while(order.every((v,k)=>v===k));
  puzState = { slots:order, sel:-1, moves:0, solved:false };
}
function renderPuzzle(){
  if(!puzState) startPuzzle();
  const tiles = puzState.slots.map((p,i)=>{
    const col=p%3, row=(p/3|0);
    const inner = `<svg viewBox="${col*100} ${row*100} 100 100" preserveAspectRatio="xMidYMid slice" width="100%" height="100%">${PUZ_PIC()}</svg>`;
    return `<div class="puz-tile${puzState.sel===i?' sel':''}${puzState.solved?' done':''}" data-pi="${i}">${inner}</div>`;
  }).join('');
  return `<div class="mod-card"><p style="text-align:center;font-size:14px;color:#7a3a5a;font-weight:700">点两块交换位置，把图画拼完整！</p><div class="puz-grid">${tiles}</div><div class="study-score" style="justify-content:center"><div>步数 <b>${puzState.moves}</b></div>${puzState.solved?'<div>🎉 拼好啦！</div>':''}</div><div class="girl-actions" style="justify-content:center"><button class="btn" id="puzRestart">🔄 重排</button></div></div>`;

function bindPuzzle(){

  main.querySelectorAll('[data-pi]').forEach(t=> t.onclick = ()=>{
    const i = Number(t.dataset.pi); if(puzState.solved) return;
    if(puzState.sel===-1){ puzState.sel=i; renderCasual(); return; }
    if(puzState.sel===i){ puzState.sel=-1; renderCasual(); return; }
    const a=puzState.sel, b=i, tmp=puzState.slots[a]; puzState.slots[a]=puzState.slots[b]; puzState.slots[b]=tmp;
    puzState.moves++; puzState.sel=-1;
    if(puzState.slots.every((v,k)=>v===k)) puzState.solved=true;
    renderCasual();
  });

/* ---- 休闲小游戏：消消乐 ---- */
const M3_THEMES = {
  fruit: { name:'🍓 水果', items:[ {c:'#ff7a9a',e:'🍓'},{c:'#7ad0ff',e:'🫐'},{c:'#ffd95e',e:'🍋'},{c:'#9be08a',e:'🍏'},{c:'#c89bff',e:'🍇'},{c:'#ff9a6a',e:'🍊'} ] },
  candy: { name:'🍬 糖果', items:[ {c:'#ff9ec4',e:'🍬'},{c:'#ffd1e8',e:'🍭'},{c:'#f7b6ff',e:'🍩'},{c:'#d9b38c',e:'🍪'},{c:'#ffc1a8',e:'🧁'},{c:'#a9795e',e:'🍫'} ] },
  animal:{ name:'🐱 动物', items:[ {c:'#ffd1a6',e:'🐱'},{c:'#e7c8a0',e:'🐰'},{c:'#c9a87c',e:'🐻'},{c:'#f2f2f2',e:'🐼'},{c:'#ffb38a',e:'🦊'},{c:'#ffd56b',e:'🐯'} ] },
  star:  { name:'⭐ 星星', items:[ {c:'#ffe27a',e:'⭐'},{c:'#cdb8ff',e:'🌟'},{c:'#bfe9ff',e:'💫'},{c:'#fff0b0',e:'🌙'},{c:'#ffd95e',e:'☀️'},{c:'#a8e6ff',e:'🌈'} ] }
};
let m3Theme = 'fruit';
function m3N(){ return (M3_THEMES[m3State?m3State.theme:'fruit']||M3_THEMES.fruit).items.length; }
function genM3(theme){
  const n = (M3_THEMES[theme||'fruit']||M3_THEMES.fruit).items.length;
  const g=[];
  for(let r=0;r<6;r++){ g[r]=[]; for(let c=0;c<6;c++){ let v; do{ v=kkRand(n); } while((c>=2&&g[r][c-1]===v&&g[r][c-2]===v)||(r>=2&&g[r-1][c]===v&&g[r-2][c]===v)); g[r][c]=v; } }
  return g;
}
function m3Matches(g){
  const hit=new Set();
  for(let r=0;r<6;r++){ let run=1; for(let c=1;c<6;c++){ if(g[r][c]!=null&&g[r][c]===g[r][c-1]) run++; else { if(run>=3) for(let k=0;k<run;k++) hit.add(r+','+(c-1-k)); run=1; } } if(run>=3) for(let k=0;k<run;k++) hit.add(r+','+(6-1-k)); }
  for(let c=0;c<6;c++){ let run=1; for(let r=1;r<6;r++){ if(g[r][c]!=null&&g[r][c]===g[r-1][c]) run++; else { if(run>=3) for(let k=0;k<run;k++) hit.add((r-1-k)+','+c); run=1; } } if(run>=3) for(let k=0;k<run;k++) hit.add((6-1-k)+','+c); }
  return hit;
}
function m3Collapse(g){
  const n=m3N();
  for(let c=0;c<6;c++){ const col=[]; for(let r=5;r>=0;r--){ if(g[r][c]!=null) col.push(g[r][c]); } while(col.length<6) col.push(kkRand(n)); for(let r=5;r>=0;r--){ g[r][c]=col[5-r]; } }
}
function m3Resolve(g){
  let cleared=0;
  while(true){ const hit=m3Matches(g); if(hit.size===0) break; hit.forEach(k=>{ const p=k.split(','); g[+p[0]][+p[1]]=null; }); cleared+=hit.size; m3Collapse(g); }
  return cleared;
}
function startMatch3(theme){ m3State = { grid:genM3(theme||m3Theme), sel:null, score:0, busy:false, theme:theme||m3Theme }; }
function renderMatch3(){
  if(!m3State) startMatch3();
  const themeItems = (M3_THEMES[m3State.theme]||M3_THEMES.fruit).items;
  const cells=[];
  for(let r=0;r<6;r++){ for(let c=0;c<6;c++){ const v=m3State.grid[r][c], col=themeItems[v]; const sel=m3State.sel&&m3State.sel.r===r&&m3State.sel.c===c?' sel':''; cells.push(`<div class="m3-cell${sel}" style="background:${col.c}" data-mr="${r}" data-mc="${c}"><span>${col.e}</span></div>`); } }
  const themeBtns = Object.keys(M3_THEMES).map(k=>`<button class="m3-theme${m3State.theme===k?' on':''}" data-mt="${k}">${M3_THEMES[k].name}</button>`).join('');
  return `<div class="mod-card">
    <p style="text-align:center;font-size:14px;color:#7a3a5a;font-weight:700">选个喜欢的主题，点两个相邻的积木交换，凑齐 3 个以上就能消除！</p>
    <div class="m3-themes">${themeBtns}</div>
    <div class="m3-grid">${cells.join('')}</div>
    <div class="study-score" style="justify-content:center"><div>得分 <b>${m3State.score}</b></div></div>
    <div class="girl-actions" style="justify-content:center"><button class="btn" id="m3Restart">🔄 新一局</button></div></div>`;
}
function bindMatch3(){
  const rs = main.querySelector('#m3Restart'); if(rs) rs.onclick = ()=>{ startMatch3(); renderCasual(); };
  main.querySelectorAll('[data-mt]').forEach(b=> b.onclick = ()=>{ m3Theme=b.dataset.mt; startMatch3(m3Theme); renderCasual(); });
  main.querySelectorAll('[data-mr]').forEach(el=> el.onclick = ()=>{
    if(m3State.busy) return;
    const r=Number(el.dataset.mr), c=Number(el.dataset.mc);
    if(!m3State.sel){ m3State.sel={r,c}; renderCasual(); return; }
    const s=m3State.sel;
    if(s.r===r&&s.c===c){ m3State.sel=null; renderCasual(); return; }
    if(Math.abs(s.r-r)+Math.abs(s.c-c)!==1){ m3State.sel={r,c}; renderCasual(); return; }
    m3State.busy=true;
    const tmp=m3State.grid[s.r][s.c]; m3State.grid[s.r][s.c]=m3State.grid[r][c]; m3State.grid[r][c]=tmp;
    if(m3Matches(m3State.grid).size===0){ const t2=m3State.grid[s.r][s.c]; m3State.grid[s.r][s.c]=m3State.grid[r][c]; m3State.grid[r][c]=t2; m3State.sel=null; m3State.busy=false; el.classList.add('miss'); setTimeout(()=>el.classList.remove('miss'),300); renderCasual(); return; }
    m3State.score += m3Resolve(m3State.grid)*10; m3State.sel=null; m3State.busy=false; renderCasual();
  });
}

function renderFruit(){
  return `<div class="mod-card"><p style="text-align:center;font-size:14px;color:#7a3a5a;font-weight:700">移动鼠标（或手指）控制小篮子，接住掉下来的水果！</p><canvas id="fruitCanvas" class="fruit-canvas" width="320" height="360"></canvas><div class="study-score" style="justify-content:center"><div>得分 <b id="fruitScore">0</b></div><div>生命 ❤️ <b id="fruitLife">3</b></div></div><div class="girl-actions" style="justify-content:center"><button class="btn primary" id="fruitStart">▶️ 开始</button><button class="btn" id="fruitStop">⏹️ 停止</button></div></div>`;
}
function fruitTick(ctx, cv){
  if(!fruitState||!ctx) return;
  const w=cv.width, h=cv.height; fruitState.t++;
  if(fruitState.t%16===0){ const es=['🍎','🍊','🍇','🍓','🍌','🍉']; fruitState.fruits.push({ x:30+Math.random()*(w-60), y:-20, vy:1.8+Math.random()*1.6, e:es[Math.floor(Math.random()*es.length)] }); }
  ctx.clearRect(0,0,w,h); ctx.fillStyle='#eaf7ff'; ctx.fillRect(0,0,w,h);
  ctx.font='30px serif';
  for(let i=fruitState.fruits.length-1;i>=0;i--){ const f=fruitState.fruits[i]; f.y+=f.vy; ctx.fillText(f.e, f.x, f.y); if(f.y>h-36 && Math.abs(f.x-fruitState.bx)<34){ fruitState.score++; fruitState.fruits.splice(i,1); continue; } if(f.y>h+12){ fruitState.life--; fruitState.fruits.splice(i,1); } }
  ctx.font='40px serif'; ctx.fillText('🧺', fruitState.bx-20, h-6);
  const sc=main.querySelector('#fruitScore'); if(sc) sc.textContent=fruitState.score;
  const lf=main.querySelector('#fruitLife'); if(lf) lf.textContent=Math.max(0,fruitState.life);
  if(fruitState.life<=0){ stopFruit(); showToast('游戏结束！本局得分 '+fruitState.score); }
}
function bindFruit(){
  stopFruit();
  const cv=main.querySelector('#fruitCanvas'); if(!cv) return;
  let ctx=null; try{ ctx=cv.getContext('2d'); }catch(e){}
  const moveB=(x)=>{ if(!fruitState) return; const rect=cv.getBoundingClientRect(); const bx=((x-rect.left)/rect.width)*cv.width; fruitState.bx=Math.max(26,Math.min(cv.width-26,bx)); };
  cv.addEventListener('mousemove', e=> moveB(e.clientX));
  cv.addEventListener('touchmove', e=>{ if(e.touches[0]) moveB(e.touches[0].clientX); }, {passive:true});
  const start=main.querySelector('#fruitStart'); if(start) start.onclick=()=>{ if(fruitState&&fruitState.life>0){ return; } fruitState={ bx:160, fruits:[], score:0, life:3, t:0 }; fruitTimer=(function(){ let _fl=0; const _fr=(ts)=>{ if(!fruitState||fruitState.life<=0){ fruitTimer=null; return; } if(ts-_fl>=40){ fruitTick(ctx,cv); _fl=ts; } if(fruitState&&fruitState.life>0) fruitTimer=requestAnimationFrame(_fr); else fruitTimer=null; }; return requestAnimationFrame(_fr); })(); };
  const stop=main.querySelector('#fruitStop'); if(stop) stop.onclick=()=>{ stopFruit(); };
}

/* 选择温柔的中文女声（优先匹配女性/中文语音），并放慢语速、略提音调 */
function pickStoryVoice(){
  if(!window.speechSynthesis || !window.speechSynthesis.getVoices) return null;
  const vs = window.speechSynthesis.getVoices();
  if(!vs.length) return null;
  const zh = vs.filter(v=>/^zh|chinese|中文|普通话|国语/i.test((v.lang||'')+' '+(v.name||'')));
  const pool = zh.length ? zh : vs;
  const kw = ['female','女','xiaoxiao','ting','mei','yunxi','huihui','yao','xiao','yaoyao','ruyi','cheng','ya','yue','xiao-yue','小云','小梦','小美'];
  const fem = pool.find(v=> kw.some(k=> (v.name||'').toLowerCase().includes(k)));
  return fem || pool[0];
}
function speakStory(text){
  try{
    if(!window.speechSynthesis) return;
    const synth = window.speechSynthesis;
    synth.cancel();
    const vs = synth.getVoices();
    if(!vs.length){ synth.addEventListener('voiceschanged', ()=> speakStory(text), {once:true}); synth.getVoices(); return; }
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'zh-CN';
    u.rate = 0.82; u.pitch = 1.15;
    const v = pickStoryVoice(); if(v) u.voice = v;
    synth.speak(u);
  }catch(e){}
}

}

let proverbLoading = false;
let proverbNetFailed = false;  // 联网获取失败标记：置位后不再由 renderStudy 自动重试，避免断网时无限递归刷屏（主动点「下一题」/切模式会清位重试）
async function genStudyProverbOnline(){
  const p = `给 6-10 岁中国小学生出一条常用英语谚语（proverb / saying），并给出中文意思。只返回 JSON：{"en":"英语谚语原文","zh":"中文含义（用孩子能懂的话）"}，不要任何解释或多余文字。谚语要常见、积极、适合小学生。`;
  try{ const out = await llmChat(p, 0.8); const o = (typeof out==='string')?JSON.parse(out):out; if(o&&typeof o.en==='string'&&o.en.trim()&&typeof o.zh==='string'&&o.zh.trim()) return { en:o.en.trim(), zh:o.zh.trim() }; }catch(e){ console.warn('谚语联网获取失败：', e); } return null;
}
async function ensureProverb(){
  if(proverbLoading) return;                 // 防重入：同一时刻只允许一个联网请求
  if(studyNet==='online'){
    proverbLoading = true; renderStudy();
    const o = await genStudyProverbOnline();
    proverbLoading = false;
    if(o){ proverbOnline = o; proverbNetFailed = false; renderStudy(); return; }
    proverbNetFailed = true;                 // 失败：标记住，renderStudy 不再自动重试（否则断网时无限递归）

let pianoCtx = null, pianoKeyHandler = null, pianoSongTimer = null;
const PIANO_KEYS = [ {n:'Do',f:261.63},{n:'Re',f:293.66},{n:'Mi',f:329.63},{n:'Fa',f:349.23},{n:'Sol',f:392.0},{n:'La',f:440.0},{n:'Ti',f:493.88},{n:'Do↑',f:523.25} ];
/* 曲目库：每个 seq 为琴键索引（对应 PIANO_KEYS），gap 为每音间隔(ms)。点击琴键/曲目均触发音效。 */
const PIANO_SONGS = [
  { name:'小星星', gap:420, seq:[0,0,4,4,5,5,4, 3,3,2,2,1,1,0, 4,4,3,3,2,2,1, 4,4,3,3,2,2,1, 0,0,4,4,5,5,4, 3,3,2,2,1,1,0] },
  { name:'两只老虎', gap:360, seq:[0,1,2,0, 0,1,2,0, 2,3,4, 2,3,4, 4,5,4,3,2,0, 4,5,4,3,2,0, 0,4,0, 0,4,0] },
  { name:'生日快乐', gap:380, seq:[0,0,1,0,3,2, 0,0,1,0,4,3, 0,0,7,5,3,2,1, 6,6,5,3,4,3] },
