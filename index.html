];
function pianoTone(freq){
  try{
    if(!pianoCtx) pianoCtx = new (window.AudioContext||window.webkitAudioContext)();
    if(pianoCtx.state==='suspended') pianoCtx.resume();
    const t0 = pianoCtx.currentTime;
    const o=pianoCtx.createOscillator(), o2=pianoCtx.createOscillator(), g=pianoCtx.createGain();
    o.type='triangle'; o.frequency.value=freq;          // 基音
    o2.type='sine';    o2.frequency.value=freq*2;        // 八度泛音，让音色更亮更像钢琴
    const g2=pianoCtx.createGain(); g2.gain.value=0.10;
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(0.25, t0+0.012); // 快速起音
    g.gain.exponentialRampToValueAtTime(0.0001, t0+0.7); // 自然衰减
    o.connect(g); o2.connect(g2); g2.connect(g); g.connect(pianoCtx.destination);
    o.start(t0); o2.start(t0); o.stop(t0+0.72); o2.stop(t0+0.72);
  }catch(e){}
}
function stopPianoSong(){ if(pianoSongTimer){ clearInterval(pianoSongTimer); pianoSongTimer=null; } }
function playPianoSong(idx){
  stopPianoSong();
  const song = PIANO_SONGS[idx]; if(!song) return;
  main.querySelectorAll('.song-btn.playing').forEach(b=>b.classList.remove('playing'));
  const sb = main.querySelector('.song-btn[data-song="'+idx+'"]'); if(sb) sb.classList.add('playing');
  let i=0;
  pianoSongTimer = setInterval(()=>{
    if(i>=song.seq.length){ stopPianoSong(); return; }
    const el = main.querySelector('[data-pk="'+song.seq[i]+'"]');
    if(el) el.click();           // 复用琴键点击：播放音效 + 高亮
    i++;
  }, song.gap);
}
function renderPiano(){
  const keys = PIANO_KEYS.map((k,i)=>`<button class="piano-key" data-pk="${i}">${k.n}<span>${k.f.toFixed(0)}</span></button>`).join('');
  return `
    <div class="page-head"><h1 class="page-title">🎹 音乐敲琴</h1><button class="back-btn" id="pianoBack">‹ 返回</button></div>
    <p class="page-sub">点琴键，或用键盘 A S D F G H J K 弹出好听的声音～</p>
    <div class="piano-wrap"><div class="piano-keys">${keys}</div>
      <p class="page-sub" style="margin:12px 0 6px">🎵 选一首曲子，听它自己弹出来～</p>
      <div class="song-list">
        ${PIANO_SONGS.map((s,i)=>`<button class="btn song-btn" data-song="${i}">${s.name}</button>`).join('')}
        <button class="btn song-btn stop" id="pianoStop">⏹ 停止</button>
      </div>
    </div>`;
}
function showPiano(){ main.innerHTML = renderPiano(); bindPiano(); }
function bindPiano(){
  stopPianoSong();
  const back=main.querySelector('#pianoBack'); if(back) back.onclick=()=>{ stopPianoSong(); if(pianoKeyHandler){ document.removeEventListener('keydown',pianoKeyHandler); pianoKeyHandler=null; } activeGame=null; renderGames(); window.scrollTo(0,0); };
  main.querySelectorAll('[data-pk]').forEach(b=> b.onclick=()=>{ const k=PIANO_KEYS[Number(b.dataset.pk)]; pianoTone(k.f); b.classList.add('hit'); setTimeout(()=>b.classList.remove('hit'),200); });
  main.querySelectorAll('.song-btn[data-song]').forEach(b=> b.onclick=()=> playPianoSong(Number(b.dataset.song)) );
  const stopBtn=main.querySelector('#pianoStop'); if(stopBtn) stopBtn.onclick=()=>{ stopPianoSong(); main.querySelectorAll('.piano-key.hit').forEach(k=>k.classList.remove('hit')); main.querySelectorAll('.song-btn.playing').forEach(b=>b.classList.remove('playing')); };
  if(pianoKeyHandler) document.removeEventListener('keydown',pianoKeyHandler);
  pianoKeyHandler=(e)=>{ const map={a:0,s:1,d:2,f:3,g:4,h:5,j:6,k:7}; const idx=map[e.key.toLowerCase()]; if(idx!==undefined){ const el=main.querySelector('[data-pk="'+idx+'"]'); if(el) el.click(); } };
  document.addEventListener('keydown', pianoKeyHandler);
}

/* ============ 五子棋（本地双人对弈） ============ */
const GOMOKU_KEY = 'kidtask_gomoku_v1';
const GOMOKU_N = 15;
let gomoku = null;   // { board:number[][](0空/1黑/2白), turn, winner, winLine, moves }
function loadGomoku(){ try { const o = JSON.parse(localStorage.getItem(GOMOKU_KEY)); if(o && Array.isArray(o.board) && o.board.length===GOMOKU_N) return o; } catch(e){} return null; }
function saveGomoku(){ try { localStorage.setItem(GOMOKU_KEY, JSON.stringify(gomoku)); } catch(e){} }
function newGomoku(){
  const board = []; for(let i=0;i<GOMOKU_N;i++) board.push(new Array(GOMOKU_N).fill(0));
  gomoku = { board, turn:1, winner:0, winLine:null, moves:0 };
  saveGomoku();
}
function gomokuCheck(r, c){
  const b = gomoku.board, v = b[r][c];
  const dirs = [[0,1],[1,0],[1,1],[1,-1]];
  for(const [dr,dc] of dirs){
    const line = [[r,c]];
    let nr=r+dr, nc=c+dc;
    while(nr>=0&&nr<GOMOKU_N&&nc>=0&&nc<GOMOKU_N&&b[nr][nc]===v){ line.push([nr,nc]); nr+=dr; nc+=dc; }
    nr=r-dr; nc=c-dc;
    while(nr>=0&&nr<GOMOKU_N&&nc>=0&&nc<GOMOKU_N&&b[nr][nc]===v){ line.unshift([nr,nc]); nr-=dr; nc-=dc; }
    if(line.length>=5) return line;
  }
  return null;
}
function gomokuPlace(r, c){
  if(!gomoku || gomoku.winner || gomoku.board[r][c]!==0) return;
  gomoku.board[r][c] = gomoku.turn;
  gomoku.moves++;
  const line = gomokuCheck(r, c);
  if(line){ gomoku.winner = gomoku.turn; gomoku.winLine = line; }
  else gomoku.turn = gomoku.turn===1?2:1;
  saveGomoku();
  renderGomoku();
}
function gomokuCellHtml(v, r, c){
  const win = gomoku.winLine && gomoku.winLine.some(p=>p[0]===r && p[1]===c);
  let inner = '';
  if(v===1) inner = '<span class="g-stone black"></span>';
  else if(v===2) inner = '<span class="g-stone white"></span>';
  return `<button class="g-cell${win?' win':''}" data-gr="${r}" data-gc="${c}" aria-label="第${r+1}行第${c+1}列">${inner}</button>`;
}
function renderGomoku(){
  if(!gomoku) newGomoku();
  const b = gomoku.board;
  let status;
  if(gomoku.winner) status = gomoku.winner===1 ? '🎉 黑棋赢啦！' : '🎉 白棋赢啦！';
  else if(gomoku.moves >= GOMOKU_N*GOMOKU_N) status = '🤝 平局啦！再来一局吧～';
  else status = `<b>${gomoku.turn===1?'⚫ 黑棋':'⚪ 白棋'}</b> 落子`;
  main.innerHTML = `
    <div class="page-head"><h1 class="page-title">⚫ 五子棋</h1><button class="back-btn" id="gomokuBack">‹ 返回</button></div>
    <p class="page-sub">黑棋先手，两人轮流落子，横、竖、斜任意方向先连成 5 子就赢啦！</p>
    <div class="gomoku-status">${status}</div>
    <div class="gomoku-board">${b.map((row,r)=>row.map((v,c)=>gomokuCellHtml(v,r,c)).join('')).join('')}</div>
    <div class="girl-actions" style="justify-content:center;margin-top:14px">
      <button class="btn primary" id="gomokuNew">🔄 重新开始</button>
    </div>`;
  const back = main.querySelector('#gomokuBack'); if(back) back.onclick = ()=>{ activeGame=null; renderGames(); window.scrollTo(0,0); };
  main.querySelectorAll('.g-cell').forEach(cell=>{
    cell.onclick = ()=>{ const r=+cell.dataset.gr, c=+cell.dataset.gc; gomokuPlace(r, c); };
  });
  const neu = main.querySelector('#gomokuNew'); if(neu) neu.onclick = ()=>{ newGomoku(); renderGomoku(); };
}

/* 石头剪刀布：和电脑猜拳，比分本地保存 */
const RPS_KEY = 'kidtask_rps_v1';
const RPS_ITEMS = [
  { id:'rock',     emoji:'✊', name:'石头' },
  { id:'scissors', emoji:'✌️', name:'剪刀' },
  { id:'paper',    emoji:'✋', name:'布' }
];
let rpsScore = loadRPS();
function loadRPS(){
  try { const o = JSON.parse(localStorage.getItem(RPS_KEY)); if(o && typeof o.win==='number') return o; } catch(e){}
  return { win:0, lose:0, draw:0 };
}
function saveRPS(){ try { localStorage.setItem(RPS_KEY, JSON.stringify(rpsScore)); } catch(e){} }
function rpsEmoji(id){ const it = RPS_ITEMS.find(x=>x.id===id); return it ? it.emoji : '❓'; }
function rpsJudge(me, cpu){
  if(me===cpu) return 'draw';
  if((me==='rock'&&cpu==='scissors') || (me==='scissors'&&cpu==='paper') || (me==='paper'&&cpu==='rock')) return 'win';
  return 'lose';
}
function renderRPS(){
  main.innerHTML = `
    <div class="page-head"><h1 class="page-title">✊ 石头剪刀布</h1><button class="back-btn" id="rpsBack">‹ 返回</button></div>

        <div class="sc">你赢<b>${rpsScore.win}</b></div>
        <div class="sc">电脑赢<b>${rpsScore.lose}</b></div>
        <div class="sc">平局<b>${rpsScore.draw}</b></div>
      </div>
      <div class="rps-arena">
        <div class="rps-hand" id="rpsMe">🤔</div>
        <div class="rps-vs">VS</div>
        <div class="rps-hand" id="rpsCpu">🤖</div>
      </div>
      <div class="rps-result" id="rpsResult">选一个手势开始吧！</div>
      <div class="rps-choices">
        ${RPS_ITEMS.map(it=>`<button class="rps-btn" data-rps="${it.id}" aria-label="${it.name}">${it.emoji}</button>`).join('')}
      </div>
      <div class="girl-actions" style="justify-content:center;margin-top:16px">

      </div>

function rpsPlay(me){
  const meH = main.querySelector('#rpsMe'), cpuH = main.querySelector('#rpsCpu'), res = main.querySelector('#rpsResult');
  if(!meH || !cpuH || !res) return;
  const cpu = RPS_ITEMS[Math.floor(Math.random()*3)].id;
  meH.classList.remove('shake'); cpuH.classList.remove('shake'); void meH.offsetWidth;
  meH.classList.add('shake'); cpuH.classList.add('shake');
  res.textContent = '出招中…'; res.className = 'rps-result';
  setTimeout(()=>{
    meH.textContent = rpsEmoji(me); cpuH.textContent = rpsEmoji(cpu);
    const r = rpsJudge(me, cpu);
    if(r==='win'){ rpsScore.win++; res.textContent = '🎉 你赢啦！'; res.className = 'rps-result win'; }
    else if(r==='lose'){ rpsScore.lose++; res.textContent = '😜 电脑赢了，再来一局！'; res.className = 'rps-result lose'; }
    else { rpsScore.draw++; res.textContent = '🤝 平局！'; res.className = 'rps-result draw'; }
    saveRPS();
    const scs = main.querySelectorAll('.rps-score .sc b');
    if(scs[0]) scs[0].textContent = rpsScore.win;
    if(scs[1]) scs[1].textContent = rpsScore.lose;
    if(scs[2]) scs[2].textContent = rpsScore.draw;
  }, 420);
}

/* ============ 放松时间 · 家长可设每日时长上限 ============ */
const RELAX_CFG_KEY = 'kidtask_relax_cfg_v1';
const RELAX_USE_KEY = 'kidtask_relax_use_v1';
let relaxCfg = loadRelaxCfg();
let relaxUsage = loadRelaxUsage();
function loadRelaxCfg(){
  try { const o = JSON.parse(localStorage.getItem(RELAX_CFG_KEY));
    if(o && typeof o==='object') return {
      enabled: o.enabled!==false,                                   // 默认启用
      dailyMin: Math.min(600, Math.max(1, Number(o.dailyMin)||30)), // 默认 30 分钟
      start: typeof o.start==='string' ? o.start : '',              // 开放开始时间 HH:MM
      end: typeof o.end==='string' ? o.end : '',                     // 开放结束时间 HH:MM
      workFree: !!o.workFree,                                       // 工作日不限制
      restFree: !!o.restFree                                        // 休息日不限制
    };
  } catch(e){}
  return { enabled:true, dailyMin:30, start:'', end:'', workFree:false, restFree:false };
}
function saveRelaxCfg(){ try{ localStorage.setItem(RELAX_CFG_KEY, JSON.stringify(relaxCfg)); }catch(e){} }
function relaxTodayStr(){ const d=new Date(); const p=n=>String(n).padStart(2,'0'); return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate()); }
function loadRelaxUsage(){
  try { const o = JSON.parse(localStorage.getItem(RELAX_USE_KEY));
    if(o && typeof o==='object' && o.date===relaxTodayStr()) return { date:o.date, sec:Number(o.sec)||0 };
  } catch(e){}
  return { date:relaxTodayStr(), sec:0 };
}
function saveRelaxUsage(){ try{ localStorage.setItem(RELAX_USE_KEY, JSON.stringify(relaxUsage)); }catch(e){} }
/* 仅落盘、不触发同步：供每秒计时节流使用，避免每秒序列化写盘 + 每秒推 MQTT */
function persistRelaxUsage(){ try{ localStorage.setItem(RELAX_USE_KEY, JSON.stringify(relaxUsage)); }catch(e){} }
function relaxTodaySec(){ const k=relaxTodayStr(); if(!relaxUsage || relaxUsage.date!==k){ relaxUsage={date:k, sec:0}; } return relaxUsage.sec; }
function relaxIsFree(){
  const dow = new Date().getDay();                            // 0=日 6=六
  const isWeekend = (dow===0 || dow===6);
  if(!relaxCfg.enabled) return true;                          // 总开关关闭 → 全不限制
  return isWeekend ? !!relaxCfg.restFree : !!relaxCfg.workFree; // 当日是否不限制
}
function relaxInWindow(){
  if(relaxIsFree()) return true;                             // 不限制日 → 始终开放
  if(!relaxCfg.start || !relaxCfg.end) return null;          // 未设时间段 → 不按时间段
  const now = new Date();
  const cur = now.getHours()*60 + now.getMinutes();
  const [sh,sm] = relaxCfg.start.split(':').map(Number);
  const [eh,em] = relaxCfg.end.split(':').map(Number);
  if(isNaN(sh)||isNaN(sm)||isNaN(eh)||isNaN(em)) return null;
  const s = sh*60+sm, e = eh*60+em;
  return cur>=s && cur<=e;                                    // true=在开放时段内
}
function relaxLimitSec(){ if(relaxIsFree()) return Infinity; if(relaxInWindow()!==null) return Infinity; return relaxCfg.enabled ? relaxCfg.dailyMin*60 : Infinity; }
function relaxRemainingSec(){ return Math.max(0, relaxLimitSec() - relaxTodaySec()); }
function fmtMin(sec){ sec=Math.max(0,Math.round(sec)); const m=Math.floor(sec/60), s=sec%60; return m>0 ? (m+' 分 '+(s<10?'0':'')+s+' 秒') : (s+' 秒'); }
function relaxBannerHtml(){
  if(relaxIsFree()){                                         // 当日不限制（关闭总开关 / 当工作日或休息日勾选了不限制）
    if(!relaxCfg.enabled){
      return `<div class="relax-banner off">⏰ 家长未启用「放松时间限制」，可以尽情玩耍～</div>`;
    }
    const isWeekend = (new Date().getDay()===0 || new Date().getDay()===6);
    const why = isWeekend
      ? (relaxCfg.restFree ? '已设为「休息日不限制」' : '今天不限制')
      : (relaxCfg.workFree ? '已设为「工作日不限制」' : '今天不限制');
    return `<div class="relax-banner free">⏰ 今天是<b>${isWeekend?'休息':'工作'}</b>日，${why}，放松时间可以尽情玩耍～</div>`;
  }
  const win = relaxInWindow();
  if(win!==null){                                            // 固定时间段模式（不限分钟）
    const open = win;
    return `<div class="relax-banner ${open?'':'closed'}">
      <div class="rb-top"><span class="rb-emo">⏰</span> 今日开放时间 <b>${relaxCfg.start}</b> – <b>${relaxCfg.end}</b>
        · 现在${open?'<b>开放中</b>，可以放心玩～':'<b>未开放</b>，到点再来哦～'}</div>
      ${open?'':'<div class="rb-note">现在不是放松时间，'+relaxCfg.start+'–'+relaxCfg.end+' 才能玩哦～</div>'}
    </div>`;
  }
  if(!relaxCfg.enabled){
    return `<div class="relax-banner off">⏰ 家长未启用「每日时长限制」，放松时间可以尽情玩耍～</div>`;
  }
  const used = relaxTodaySec(), lim = relaxLimitSec(), rem = relaxRemainingSec();
  const pct = Math.min(100, Math.round(used/lim*100));
  const done = rem<=0;
  return `<div class="relax-banner ${done?'done':''}" id="relaxBanner">
    <div class="rb-top"><span class="rb-emo">⏰</span> 今日放松时间上限 <b>${relaxCfg.dailyMin}</b> 分钟
      · 已用 <b id="rbUsed">${fmtMin(used)}</b> · 剩余 <b id="rbRem">${fmtMin(rem)}</b></div>
    <div class="rb-bar"><span style="width:${pct}%${done?' class="full"':''}"></span></div>
    ${done?'<div class="rb-note">今日放松时间已用完啦，明天再来玩吧～</div>':''}
  </div>`;
}
let relaxTimer = null;
function tickRelax(){
  if(page!=='games') return;                 // 只在放松时间页累计
  if(relaxInWindow()!==null) return;         // 时段模式不限分钟，不累计
  relaxUsage.sec += 1;
  if(relaxUsage.sec % 10 === 0) persistRelaxUsage();   // 节流写盘：每 10 秒落一次，不再每秒序列化 localStorage
  const banner = document.getElementById('relaxBanner');
  if(banner){
    const used = relaxTodaySec(), rem = relaxRemainingSec();
    const ru = document.getElementById('rbUsed'), rr = document.getElementById('rbRem');
    if(ru) ru.textContent = fmtMin(used);
    if(rr) rr.textContent = fmtMin(rem);
    const bar = banner.querySelector('.rb-bar span');
    if(bar){ bar.style.width = Math.min(100, Math.round(used/(relaxCfg.dailyMin*60)*100))+'%'; if(rem<=0) bar.className='full'; }
    if(rem<=0 && !banner.classList.contains('done')){ banner.classList.add('done'); const n=banner.querySelector('.rb-note'); if(!n){ const d=document.createElement('div'); d.className='rb-note'; d.textContent='今日放松时间已用完啦，明天再来玩吧～'; banner.appendChild(d); } }
  }
}
function startRelaxTimer(){ if(relaxTimer) return; relaxTimer = setInterval(tickRelax, 1000); }
function stopRelaxTimer(){ if(relaxTimer){ clearInterval(relaxTimer); relaxTimer=null; } persistRelaxUsage(); }  // 离开放松页：落盘最新秒数（纯本地，不同步）

function fmtDateTime(d){ const p=n=>String(n).padStart(2,'0'); return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes()); }
function fmtDateTimeCN(d){ const p=n=>String(n).padStart(2,'0'); return d.getFullYear()+'年'+p(d.getMonth()+1)+'月'+p(d.getDate())+'日 '+p(d.getHours())+':'+p(d.getMinutes()); }
function round1(x){ return Math.round(x*10)/10; }
function fmtDiceVal(v){ return Number.isInteger(v) ? String(v) : Number(v).toFixed(1); }
/* 按局数决定 低/高区间 的数量，生成 6 个数 */
function genDiceRound(R){
  let low, high;
  if(R<=6) { low=5; high=1; }
  else if(R<=12) { low=4; high=2; }
  else if(R<=18) { low=3; high=3; }
  else if(R<=24) { low=2; high=4; }
  else if(R<=30) { low=1; high=5; }
  else { low=0; high=6; }
  const arr = [];
  const [hMin, hMax] = diceHighRange(R);
  for(let i=0;i<low;i++){ arr.push(round1(diceCfg.lowMin + Math.random()*(diceCfg.lowMax - diceCfg.lowMin))); }
  for(let i=0;i<high;i++){ arr.push(Math.floor(hMin + Math.random()*(hMax - hMin + 1))); }
  return arr; // 长度恒为 6
}
/* 按局数给出本局高位整数的实际取值区间 [min,max]。
   第 <bigFromRound 局时不允许出现 >=bigMin 的大数（上限压到 bigMin-1），逐步放开到 highMax。
   若下限本身已 >= bigMin（家长配置冲突），则退化为不限制，避免出现空区间。 */
function diceHighRange(R){
  const baseMax = Number(diceCfg.highMax)||20, baseMin = Number(diceCfg.highMin)||1;
  const from = Math.max(1, Number(diceCfg.bigFromRound)||10);
  const gate = Math.max(1, Number(diceCfg.bigMin)||10);
  if(R >= from) return [baseMin, baseMax];
  const cap = Math.min(baseMax, gate - 1);
  if(cap < baseMin) return [baseMin, baseMax];
  return [baseMin, cap];
}

    dice.current = genDiceRound(dice.round);
    diceSel = null; saveDice(); renderDice();
    showToast('已按第 '+dice.round+' 局规则刷新数字 🎲');
  };
  main.querySelectorAll('.dchip').forEach(ch=>{
    ch.onclick = ()=>{
      const i = parseInt(ch.dataset.i, 10);
      if(diceSel===null){ diceSel = i; renderDice(); }
      else if(diceSel===i){ diceSel = null; renderDice(); }
      else {
        const a = dice.current[diceSel], c = dice.current[i];
        dice.current[diceSel] = c; dice.current[i] = a;
        diceSel = null; saveDice(); renderDice();
      }
    };
  });
}
function shuffleArr(arr){ for(let i=arr.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); const t=arr[i]; arr[i]=arr[j]; arr[j]=t; } }
function rollDice(){
  const stars = starCount();
  if(stars <= 0){ showToast('⭐ 星星不够啦，去完成「我的任务」赚星星，就能继续摇！'); return; }
  if(!dice.current || dice.current.length!==6){ dice.current = genDiceRound(dice.round); }
  const face = Math.floor(Math.random()*6)+1;
  const val = dice.current[face-1];
  dice.lastRound = dice.round; dice.lastFace = face; dice.lastVal = val;
  dice.details.push({ r:dice.round, idx:face, val:val });
  dice.used++;   // 每摇一次消耗 1 颗星星（共享星星池，跨端同步）
  dice.round++;  // 每摇一次算一局
  // 记录星星使用历史：每摇一次消耗 1 颗星星（带唯一 id，便于跨端按 id 并集合并去重）
  starLog.unshift({ id: senderId + '-' + Date.now() + '-' + Math.random().toString(36).slice(2,6), ts: Date.now(), date: fmtDateTime(new Date()), round: dice.lastRound, val: val, remain: starCount() });
  if(starLog.length > 1000) starLog.length = 1000;   // 上限 200→1000：保留更完整的星星使用历史
  saveStarLog(); saveDice();
  pushSync(true);   // 立即把「已消耗星星」广播到全家，各端星星数保持一致
  diceSel = null; renderDice();
}

function loadPetCfg(){
  try{ const s = localStorage.getItem(PET_CFG_KEY); if(s){ const c = JSON.parse(s); if(!c.subjects || !c.subjects.length) c.subjects=['语文','数学','英语']; return c; } }catch(e){}
  return { unlockNeed:1, upgradeNeed:1, subjects:['语文','数学','英语'] };
}
function savePetCfg(){ try{ localStorage.setItem(PET_CFG_KEY, JSON.stringify(petCfg)); }catch(e){} }

function newPet(){
  return { type:null, gender:'girl', name:'', level:1, clean:80, mood:80, energy:80,
           wear:{hat:null,cloth:null,acc:null,glass:null,shoe:null}, unlocked:{}, _day:todayKey() };
}
function normalizePet(p){
  p = p || {};
  p.type = p.type || null; p.gender = p.gender || 'girl'; p.name = p.name || '';
  p.level = p.level || 1;
  p.clean = p.clean==null ? 80 : p.clean;
  p.mood = p.mood==null ? 80 : p.mood;
  p.energy = p.energy==null ? 80 : p.energy;
  const DW = {hat:null,cloth:null,acc:null,glass:null,shoe:null};
  p.wear = Object.assign({}, DW, (p.wear && typeof p.wear==='object') ? p.wear : {});
  p.unlocked = p.unlocked || {};
  p._day = p._day || todayKey();
  if(p._day !== todayKey()){
    p.clean = Math.max(0,Math.min(100,p.clean-15));
    p.mood = Math.max(0,Math.min(100,p.mood-15));
    p.energy = Math.max(0,Math.min(100,p.energy-15));
    p._day = todayKey();
  }
  return p;
}
function loadPetStore(){
  try{
    const s = localStorage.getItem(PET_KEY);
    if(s){
      const d = JSON.parse(s);
      let arr, cur = 0;
      if(d && Array.isArray(d.pets)){ arr = d.pets; cur = d.curPet || 0; }     // 新版多宠物
      else if(d && d.type){ arr = [d]; cur = 0; }                              // 旧版单宠物
      else { arr = []; cur = 0; }
      arr = arr.map(normalizePet);
      if(cur >= arr.length) cur = 0;
      return { pets: arr, curPet: cur };
    }
  }catch(e){}
  return { pets: [], curPet: 0 };
}
function savePet(){ try{ localStorage.setItem(PET_KEY, JSON.stringify({ pets, curPet })); }catch(e){} }
function cap(v){ return Math.max(0, Math.min(100, v)); }
function todayKey(){ const d=new Date(); return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate(); }
function petReadiness(){ return Math.round((pet.clean+pet.mood+pet.energy)/3); }
function petUpgradeReady(){ return petReadiness() >= 70; }

function wearHi(key, val){
  const op = PET_OPS.find(o=>o.key===key);
  if(!op || !op.items) return false;
  return op.items.indexOf(val) >= 2;   // tier>=2 视为「高级装扮」
}

function getPetQuestions(){
  if(!grade) return [];
  let all = [];
  petCfg.subjects.forEach(sub=>{ all = all.concat(getBank(grade, semester, sub)); });
  return all;
}
function makeFallbackQuestion(){
  const a = Math.floor(Math.random()*9)+1, b = Math.floor(Math.random()*9)+1, op = Math.random()<0.5?'+':'-';
  let res = op==='+'? a+b : a-b; if(res<0) return makeFallbackQuestion();
  const opts = [res]; while(opts.length<3){ const r = Math.floor(Math.random()*19); if(!opts.includes(r)) opts.push(r); }
  const o = shuffle(opts);
  return { q:`${a} ${op} ${b} = ?`, o, a:o.indexOf(res), diff:'简单' };
}
function nextPetQuestion(){
  let pool = getPetQuestions();
  if(petQuiz && petQuiz.purpose==='adopt'){           // 领养门槛：只出困难题
    const hard = pool.filter(q=>q.diff==='困难');
    if(hard.length) pool = hard;
  }
  petQuestion = pool.length ? shuffleOptions(shuffle(pool)[0]) : makeFallbackQuestion();
  if(!petQuestion) petQuestion = makeFallbackQuestion();
}
/* 日常护理题目：优先由大模型按当前年级/学科抽取，失败则回退本地题库。
   一次抽取 3 道并缓存其中 2 道，减少多次护理时的等待。 */
let petCareQCache = [];
function nextPetLocalQuestion(){
  let pool = getPetQuestions();
  if(!pool.length) return makeFallbackQuestion();
  return shuffleOptions(shuffle(pool)[0]) || makeFallbackQuestion();
}
async function genPetCareQuestion(){
  if(quizMode === 'local'){            // 本地模式：直接用人工校验过的本地题库，答案严谨，不联网
    return nextPetLocalQuestion();
  }
  if(petCareQCache.length) return petCareQCache.shift();
  try{
    const subs = (petCfg.subjects && petCfg.subjects.length) ? petCfg.subjects : ['语文','数学','英语'];
    const sub = subs[Math.floor(Math.random()*subs.length)];
    // 联网出题：最多等 12 秒，超时或失败立即回退本地题库（避免「一直刷不出来」）
    const qs = await Promise.race([
      callLLMDirect(grade, sub, SUBJECT_EDITION[sub]||'人教版', '简单', semester, 3),
      new Promise((_, rej) => setTimeout(() => rej(new Error('k12-timeout-local')), 12000))
    ]).catch(() => null);
    if(qs && qs.length){
      const normOne = q => { const n = normModelQ(q); return (n && n.o.length>=2) ? n : null; };
      petCareQCache = qs.slice(1).map(normOne).filter(Boolean);
      const q = normOne(qs[0]);
      if(q) return q;
    }
  }catch(e){ console.warn('宠物护理出题(大模型)失败，回退本地题库：', e); }
  return nextPetLocalQuestion();
}
async function startPetCareQuiz(key){
  const op = PET_OPS.find(o=>o.key===key);
  if(!op) return;
  petQuiz = { purpose:'care', target:key, need:1, got:0, loading:true };
  renderPet();                       // 显示「出题中…」
  let q = null;
  try{ q = await genPetCareQuestion(); }catch(e){ q = nextPetLocalQuestion(); }
  if(!q) q = makeFallbackQuestion();
  petQuestion = q;
  if(petQuiz && petQuiz.purpose==='care'){ petQuiz.loading = false; renderPet(); }
  else { renderPet(); }              // 用户中途取消：返回宠物页
}

function answerPetQuiz(idx){

        showToast('🎉 解锁「'+(op?op.name:'')+'」成功！');
        petQuiz = null; petDressPick = key; renderPet(); return;   // 解锁后直接打开挑选面板
      } else if(petQuiz.purpose==='care'){
        const op = PET_OPS.find(o=>o.key===petQuiz.target);
        if(op && op.fx){ op.fx(pet); }
        savePet();
        showToast('💗 '+op.name+' 完成！'+op.desc);
        petQuiz = null; renderPet(); return;
      } else if(petQuiz.purpose==='adopt'){
        petQuiz = null;
        petSetupType='rabbit'; petSetupGender='girl'; petSetupName='';
        showToast('🎉 太棒了！现在来选一只新宠物吧～');
        renderPetSetup();
        return;
      } else {
        const prevStage = petStage();
        pet.level++;
        pet.clean = cap(pet.clean-30); pet.mood = cap(pet.mood-30); pet.energy = cap(pet.energy-30);
        savePet();
        let msg = '🎉 升级成功！宠物升到 Lv.'+pet.level+'！';
        if(petStage() > prevStage) msg += ' 形态进化成「'+petStageName()+'」！';
        showToast(msg);
      }
      petQuiz = null; renderPet();
    } else {
      petQuestion._correct = true; renderPet();
      setTimeout(()=>{ nextPetQuestion(); renderPet(); }, 700);
    }
  } else {
    if(petQuiz.purpose==='adopt'){
      petQuiz.got = 0; renderPet();
      showToast('❌ 答错啦，连击中断，需重新连对 '+petQuiz.need+' 道！');
      setTimeout(()=>{ nextPetQuestion(); renderPet(); }, 800);
    } else {
      petQuestion._wrong = true; petQuestion._wrongIdx = idx; renderPet();
    }
  }
}

/* ================= 爱心庄园：仿支付宝「蚂蚁庄园」玩法 =================
   完成任务 → 产生饲料（180g=1份）→ 喂小鸡 → 小鸡进食 → 产爱心蛋 → 收蛋 → 捐蛋做公益
   另有「庄园小课堂」每日一题（大模型按年级抽题）与小鸡装扮。                       */
const MANOR_KEY   = 'kidtask_manor_v1';
const FEED_PER_TASK = 60;     // 每完成一项任务产出的饲料克数

const EAT_MS        = 6000;   // 小鸡进食时长（毫秒）
const MANOR_LVUP_EXP = 50;    // 升到下一级所需经验

const CHICK_SKINS = [

const CHARITY = [
  { id:'book', icon:'📚', name:'山区图书角', need:20, desc:'给大山里的小朋友送去一批课外书' },
  { id:'cat',  icon:'🐱', name:'流浪猫的家', need:15, desc:'为小区的流浪猫搭一个温暖的窝' },
  { id:'meal', icon:'🍚', name:'营养午餐',   need:25, desc:'为山区小朋友加一份有肉有菜的午餐' },
  { id:'tree', icon:'🌳', name:'荒漠种树',   need:30, desc:'在沙漠边种下一棵防风固沙的小树' }
];
let manor = loadManor();
let manorQuiz = null;      // { loading, q, wrong }
let manorTimer = null;     // 进食结束定时器
let manorTick = null;      // 倒计时刷新

function defaultManor(){
  return { feedG:0, bags:1, eggs:0, ground:[], status:'idle', eatEnd:0,
    level:1, exp:0, mood:70, skin:'none', skins:['none'],
    eggsTotal:0, donated:0, projects:{}, love:0,
    claimed:[], quizDay:'', bonusDay:'',
    quizDate:'', quizRewards:0, quizBatch:0 };
}
function loadManor(){
  try{
    const s = localStorage.getItem(MANOR_KEY);
    if(s){
      const m = Object.assign(defaultManor(), JSON.parse(s));
      m.ground   = Array.isArray(m.ground) ? m.ground : [];
      m.claimed  = Array.isArray(m.claimed) ? m.claimed : [];
      m.skins    = Array.isArray(m.skins) && m.skins.length ? m.skins : ['none'];
      m.projects = (m.projects && typeof m.projects==='object') ? m.projects : {};
      return m;
    }
  }catch(e){}
  return defaultManor();
}
function saveManor(){ try{ localStorage.setItem(MANOR_KEY, JSON.stringify(manor)); }catch(e){} }
/* ---- 等级 / 经验：庄园等级（仿宠物进化阶段） ---- */
function manorStageName(){
  const L = manor.level || 1;
  if(L >= 9) return '🌟 爱心天使';
  if(L >= 7) return '👑 鸡皇后';
  if(L >= 5) return '🐔 大母鸡';
  if(L >= 3) return '🐥 小母鸡';
  return '🐤 鸡宝宝';
}
function manorLevelUpCheck(){
  let up = false;
  while(manor.exp >= MANOR_LVUP_EXP){ manor.exp -= MANOR_LVUP_EXP; manor.level++; up = true; }
  return up;
}
/* 今日任务统计（庄园/换装屋共用） */
function todayPending(){
  const t = todayInfo();
  return tasks.filter(x => taskVisible(x) && taskMatchesDate(x, t.date) && !doneOnDay(x, t.date) && !x.cancelled).length;
}
function hasTodayTasks(){
  const t = todayInfo();
  return tasks.some(x=> taskVisible(x) && taskMatchesDate(x, t.date));
}

/* ---- 饲料：来自已完成的任务（每项 60g），未收取的会攒着等你来「收饲料」 ---- */
function manorClaimable(){
  return tasks.filter(t => taskVisible(t) && t.done && !t.cancelled && manor.claimed.indexOf(t.id) < 0);
}
function manorMergeBags(){
  while(manor.feedG >= FEED_BAG){ manor.feedG -= FEED_BAG; manor.bags++; }
}
function claimFeed(){
  const list = manorClaimable();
  if(!list.length){ showToast('🌾 暂时没有新的饲料，先去完成任务吧～'); return; }
  list.forEach(t => manor.claimed.push(t.id));
  const g = list.length * FEED_PER_TASK;
  const before = manor.bags;
  manor.feedG += g;
  manorMergeBags();
  manor.mood = Math.min(100, manor.mood + 5);
  saveManor(); renderManor();
  const got = manor.bags - before;
  showToast('🌾 收取 ' + g + 'g 饲料（来自 ' + list.length + ' 项已完成任务）' + (got>0 ? '，合成 '+got+' 份！' : ''));
}
/* 今日全勤奖励：当天任务全部完成，可领 1 份饲料 + 10 爱心值（每天一次） */
function claimManorBonus(){
  const t = todayInfo();
  if(manor.bonusDay === t.iso || todayPending() > 0 || !hasTodayTasks()) return;
  manor.bonusDay = t.iso; manor.bags++; manor.love += 10; manor.mood = 100;
  saveManor(); renderManor();
  showToast('🎁 今日全勤！获得 1 份饲料 + 10 爱心值');
}

/* ---- 喂小鸡 → 进食 → 产蛋 ---- */
function feedChick(){
  if(manor.status === 'eating'){ showToast('小鸡正在吃饭，等它吃完再喂哦～'); return; }
  if(manor.bags <= 0){ showToast('🌾 饲料不够啦！完成任务就能收取饲料'); return; }
  manor.bags--;
  manor.status = 'eating';
  manor.eatEnd = Date.now() + EAT_MS;
  saveManor(); renderManor();
}
function scheduleEat(){
  if(manorTimer){ clearTimeout(manorTimer); manorTimer = null; }
  if(manorTick){ cancelAnimationFrame(manorTick); manorTick = null; }
  if(manor.status !== 'eating') return;
  const left = Math.max(0, manor.eatEnd - Date.now());
  manorTimer = setTimeout(finishEat, left);
  manorTick = (function(){ let _ml=0; const _mr=(ts)=>{ const el=document.getElementById('eatLeft'); if(!el||manor.status!=='eating'){ manorTick=null; return; } if(ts-_ml>=250){ el.textContent=Math.max(0, Math.ceil((manor.eatEnd-Date.now())/1000)); _ml=ts; } manorTick=requestAnimationFrame(_mr); }; return requestAnimationFrame(_mr); })();
}
function finishEat(){
  if(manor.status !== 'eating') return;
  manor.status = 'idle'; manor.eatEnd = 0;
  manor.ground.push({ id: Date.now()+''+Math.floor(Math.random()*1000), x: 20 + Math.floor(Math.random()*58) });
  manor.exp += 12; manor.mood = Math.min(100, manor.mood + 12);
  const up = manorLevelUpCheck();
  saveManor();
  if(page === 'games' && activeGame === 'manor') renderManor();
  showToast(up ? ('🥚 小鸡吃饱啦，产下爱心蛋！并升到 Lv.'+manor.level+' 🎉') : '🥚 小鸡吃饱啦，产下了一颗爱心蛋！');
}
function collectEgg(id){
  const i = manor.ground.findIndex(e => e.id === id);
  if(i < 0) return;
  manor.ground.splice(i,1);
  manor.eggs++; manor.eggsTotal++;
  saveManor(); renderManor();
  showToast('🥚 收下 1 颗爱心蛋！可以去做公益啦');
}
function collectAllEggs(){
  const n = manor.ground.length;
  if(!n) return;
  manor.ground = [];
  manor.eggs += n; manor.eggsTotal += n;
  saveManor(); renderManor();
  showToast('🥚 一次收下 ' + n + ' 颗爱心蛋！');
}
/* ---- 捐蛋做公益 ---- */
function donateEgg(pid, n){
  const p = CHARITY.find(x => x.id === pid);
  if(!p) return;
  const cur = manor.projects[pid] || 0;
  if(cur >= p.need){ showToast('这个公益项目已经完成啦，换一个试试～'); return; }
  n = Math.min(n, manor.eggs, p.need - cur);
  if(n <= 0){ showToast('🥚 爱心蛋不够啦，先去喂小鸡产蛋吧'); return; }
  manor.eggs -= n;
  manor.projects[pid] = cur + n;
  manor.donated += n;
  manor.love += n * 2;
  manor.exp += n * 2;
  const up = manorLevelUpCheck();
  const done = manor.projects[pid] >= p.need;
  saveManor(); renderManor();
  if(done) showCert(p);
  else showToast('❤️ 捐出 ' + n + ' 颗爱心蛋，你真善良！（+' + (n*2) + ' 爱心值' + (up ? '，庄园升到 Lv.'+manor.level+' 🎉' : '') + '）');
}
function showCert(p){
  const ov = document.createElement('div');
  ov.className = 'overlay encourage-ov';
  ov.innerHTML = `
    <div class="encourage-modal all">
      <div class="enc-emoji">${p.icon}</div>
      <div class="enc-title">公益完成啦！</div>
      <div class="enc-msg">你一共捐出 <b>${p.need}</b> 颗爱心蛋，完成了「${esc(p.name)}」<br>${esc(p.desc)}<br><br>🏅 获得「爱心小天使」证书</div>
      <button class="enc-ok" id="certOk">我很棒 🎉</button>
    </div>`;
  document.body.appendChild(ov);
  ov.querySelector('#certOk').onclick = () => ov.remove();
  ov.onclick = (e) => { if(e.target === ov) ov.remove(); };
}
/* ---- 小鸡装扮（用爱心值兑换） ---- */
function pickSkin(id){
  const s = CHICK_SKINS.find(x => x.id === id);
  if(!s) return;
  if(manor.skins.indexOf(id) < 0){
    if(manor.love < s.cost){ showToast('❤️ 爱心值不够啦（还差 ' + (s.cost - manor.love) + '），多做公益就能攒到～'); return; }
    manor.love -= s.cost; manor.skins.push(id);
    showToast('🎀 兑换成功！给小鸡戴上「' + s.name + '」');
  }
  manor.skin = id;
  saveManor(); renderManor();
}
/* ---- 庄园小课堂：每答对 3 题得 1 次奖励（1🌾+5❤️），每天最多 5 次 ---- */
function resetManorQuizDay(){
  const t = todayInfo();
  if(manor.quizDate !== t.iso){
    manor.quizDate = t.iso;
    manor.quizRewards = 0;
    manor.quizBatch = 0;
    saveManor();
  }
}
async function loadManorQuestion(){
  manorQuiz = { loading:true, q:null, wrong:-1, answered:false, correct:false, fb:null, fbType:'' };
  renderManorQuiz();
  let q = null;
  try{ q = await genPetCareQuestion(); }catch(e){ /* 降级到本地题库 */ }
  if(!q) q = nextPetLocalQuestion();
  if(!q) q = makeFallbackQuestion();
  if(!manorQuiz) return;                 // 用户中途退出
  manorQuiz = { loading:false, q, wrong:-1, answered:false, correct:false, fb:null, fbType:'' };

}

  if(manor.quizRewards >= MANOR_QUIZ_MAX){
    showToast(`📚 今天的小课堂奖励已领满（${MANOR_QUIZ_MAX}/${MANOR_QUIZ_MAX}），明天再来～`);
    return;

async function nextManorQuiz(){

function answerManorQuiz(i){
  if(!manorQuiz || !manorQuiz.q || manorQuiz.answered) return;
  manorQuiz.answered = true;
  if(i === manorQuiz.q.a){
    manorQuiz.correct = true;
    manor.quizBatch = (manor.quizBatch || 0) + 1;
    if(manor.quizBatch >= MANOR_QUIZ_NEED){
      manor.quizBatch = 0;
      if(manor.quizRewards < MANOR_QUIZ_MAX){
        manor.bags++; manor.love += 5; manor.quizRewards++;
        manorQuiz.fb = `🎉 答对 ${MANOR_QUIZ_NEED} 题，获得 1 份饲料 + 5 爱心值！（今日第 ${manor.quizRewards}/${MANOR_QUIZ_MAX} 次）`;
        manorQuiz.fbType = 'reward';
      } else {
        manorQuiz.fb = `✅ 答对啦！不过今天的小课堂奖励已领满（${MANOR_QUIZ_MAX}/${MANOR_QUIZ_MAX}），明天再来吧～`;
        manorQuiz.fbType = 'info';
      }
    } else {
      manorQuiz.fb = `🐣 答对啦！还差 ${MANOR_QUIZ_NEED - manor.quizBatch} 题就能再拿 1 次奖励（今日已得 ${manor.quizRewards}/${MANOR_QUIZ_MAX} 次）`;
      manorQuiz.fbType = 'good';
    }
  } else {
    manorQuiz.correct = false;
    manorQuiz.wrong = i;
    manorQuiz.fb = `❌ 答错啦，没关系，再接再厉～（还差 ${MANOR_QUIZ_NEED - manor.quizBatch} 题得 1 次奖励）`;

  renderManorQuiz();
  lockReturn(3);
}

];
const DU_RANKV = { C:1, B:2, A:3, S:4 };

function defaultDressup(){
  const own = {};
  DU_LOOKS.forEach(l => { if(l.cost === 0) own[l.id] = true; });
  return { coins:30, owned:own, current:'school', best:{}, bonusDay:'', quizDay:'', quizCount:0 };
}
function loadDressup(){
  try{
    const s = localStorage.getItem(DU_KEY);
    if(!s) return defaultDressup();
    const d = Object.assign(defaultDressup(), JSON.parse(s));
    DU_LOOKS.forEach(l => { if(l.cost === 0) d.owned[l.id] = true; });
    if(!d.owned[d.current]) d.current = 'school';
    return d;
  }catch(e){ return defaultDressup(); }
}
function saveDressup(){ try{ localStorage.setItem(DU_KEY, JSON.stringify(dressup)); }catch(e){} }
let dressup = loadDressup();
let duQuiz = null;            // 答题赢装扮临时状态 {loading,q,wrong,won,wonLook,bonusCoins}
function duLook(id){ return DU_LOOKS.find(l => l.id === id) || null; }
function duTotals(){ const l = duLook(dressup.current); return l ? l.style : duA(0,0,0,0,0); }

function duScore(stageId){
  const stage = DU_STAGES.find(s => s.id === stageId);
  const st = duTotals();
  let sum = 0, n = 0, miss = [];
  for(const k in stage.need){
    const need = stage.need[k], have = st[k] || 0;
    n++; sum += Math.min(1, have / need);
    if(have < need) miss.push({ k, have, need });
  }
  const ratio = n ? sum / n : 1;
  const allMet = miss.length === 0;
  const rank = allMet ? 'S' : 'C';
  return { rank, ratio, miss, stage };
}
function duChallenge(stageId){
  const r = duScore(stageId);
  if(r.rank === 'C'){
    renderDressup();
    showToast('这套造型不太符合主题，换一套再试试吧～');
    return;
  }
  const stage = r.stage;
  const gain = r.rank === undefined ? 0
    : (r.rank === 'S' ? stage.reward : r.rank === 'A' ? stage.reward : Math.round(stage.reward * 0.6));
  dressup.coins += gain;
  const prev = dressup.best[stageId] || '';
  const better = !prev || DU_RANKV[r.rank] > DU_RANKV[prev];
  if(better) dressup.best[stageId] = r.rank;
  saveDressup();
  renderDressup();
  const look = duLook(dressup.current);
  showToast(`「${stage.name}」挑战 ${r.rank}！获得 💎${gain} 星钻` + (better ? '（新纪录✨）' : ''));
}
function duSelect(id){
  const l = duLook(id);
  if(!l) return;
  if(!dressup.owned[id]){ duUnlock(id); return; }
  dressup.current = id;
  saveDressup();
  renderDressup();
}
function duUnlock(id){
  const l = duLook(id);
  if(!l || dressup.owned[id]) return;
  if(dressup.coins < l.cost){
    showToast('💎 星钻不够啦（还差 ' + (l.cost - dressup.coins) + '），去完成搭配挑战赚星钻吧～');
    return;
  }
  openConfirmModal('解锁造型', `确定花 💎${l.cost} 星钻解锁「${l.name}」并换上吗？`, () => {
    dressup.coins -= l.cost;
    dressup.owned[id] = true;
    dressup.current = id;
    saveDressup();
    renderDressup();
    showToast('已解锁并换上「' + l.name + '」👗');
  });
}

      const win = locked[Math.floor(Math.random()*locked.length)];

      duQuiz = { loading:false, q:duQuiz.q, wrong:-1, won:true, wonLook:win, bonusCoins:0 };

      renderDressup();
      showToast('🎉 答对啦！获得新造型「' + win.name + '」并自动穿上👗');

3. 给出 exp 字段：一句话解析，说明正确答案为什么对。

{"q":"题目文字","o":["选项A","选项B","选项C"],"a":0,"diff":"简单","exp":"解析文字"}
确保 a 在 0-2 之间且选项正确。`;
  const out = await llmJson(prompt);
  if(!out || typeof out.q !== 'string' || !Array.isArray(out.o) || out.o.length !== 3 || typeof out.a !== 'number' || out.a < 0 || out.a > 2){
    throw new Error('模型返回题目格式不正确');
  }
  return { q: out.q.trim(), o: out.o.map(String), a: Number(out.a), diff: String(out.diff || '简单'), exp: String(out.exp || '') };

function gdPartSvg(key,id){
  if(key==='hair'){ return P('70 18 120 172', baseHead()+hairBack(id)+hairFront(id, id==='h1'), 'girl-thumb'); }
  if(key==='clothes'){ return P('62 186 136 152', baseTorso()+drawHands()+drawClothes(id), 'girl-thumb'); }
  if(key==='shoes'){ return P('92 300 96 168', baseLegs()+drawShoes(id), 'girl-thumb'); }

/* 近期已做过的题目（按科目记录），用于尽量不重复出现 */
const RECENT_Q_KEY = 'kidtask_recent_q_v1';
function loadRecentQ(){ try { return JSON.parse(localStorage.getItem(RECENT_Q_KEY)||'{}'); } catch(e){ return {}; } }
function saveRecentQ(o){ try { localStorage.setItem(RECENT_Q_KEY, JSON.stringify(o)); } catch(e){} }

function buildLocalTest(sub){
  let pool = getBank(grade, semester, sub).slice();
  if(learnDiff!=='全部') pool = pool.filter(q=>q.diff===learnDiff);
  // 1) 题干去重：完全相同的题干只保留一条
  const seen = new Set();
  pool = pool.filter(q=>{ const k=(q.q||'').trim(); if(seen.has(k)) return false; seen.add(k); return true; });
  // 2) 尽量避开“最近做过的题”
  const recent = loadRecentQ();
  const recSet = new Set((recent[sub]||[]).map(s=>s.trim()));
  const fresh = pool.filter(q=>!recSet.has((q.q||'').trim()));
  const base = fresh.length >= 10 ? fresh : pool;          // fresh 不足 10 题时退回全量
  const chosen = shuffle(base).slice(0, Math.min(base.length, 10));   // 随机抽取，最多 10 题
  if(!chosen.length) return null;
  // 记录本次题目，供下次继续避开
  recent[sub] = ((recent[sub]||[]).concat(chosen.map(q=>(q.q||'').trim()))).slice(-40);
  saveRecentQ(recent);
  return {
    sub, emoji: SUBJECT_EMOJI[sub],
    title: gradeName(grade)+'·'+SUBJECT_EDITION[sub]+'·'+sub+'练习（本地）',
    qs: chosen.map(shuffleOptions)
  };
}

/* ── 数学计算练习：根据年级/学期本地随机生成 50 道计算题，按答对题数发积分 ── */
function calcRI(a,b){ return Math.floor(Math.random()*(b-a+1))+a; }
function calcFmt(n){ return (Math.round(n*100)/100).toString(); }

/* 各年级/学期对应的题型生成器（返回 {q:'算式', a:数值答案}） */
const CALC_GEN = {
  add10: ()=>{ const a=calcRI(1,10), b=calcRI(1,10); return {q:`${a} + ${b}`, a:a+b}; },
  add20: ()=>{ const a=calcRI(1,20), b=calcRI(1,20); return {q:`${a} + ${b}`, a:a+b}; },
  add100: ()=>{ const a=calcRI(1,100), b=calcRI(1,100); return {q:`${a} + ${b}`, a:a+b}; },
  sub10: ()=>{ const a=calcRI(1,10), b=calcRI(1,a); return {q:`${a} - ${b}`, a:a-b}; },
  sub20: ()=>{ const a=calcRI(1,20), b=calcRI(1,a); return {q:`${a} - ${b}`, a:a-b}; },
  sub100: ()=>{ const a=calcRI(1,100), b=calcRI(1,a); return {q:`${a} - ${b}`, a:a-b}; },
  tens: ()=>{ const a=calcRI(1,9)*10, b=calcRI(1,9)*10; return {q:`${a} + ${b}`, a:a+b}; },
  mulT: ()=>{ const x=calcRI(2,9), y=calcRI(2,9); return {q:`${x} × ${y}`, a:x*y}; },
  divT: ()=>{ const y=calcRI(2,9), q=calcRI(2,9); return {q:`${y*q} ÷ ${y}`, a:q}; },
  mul21: ()=>{ const a=calcRI(10,99), b=calcRI(2,9); return {q:`${a} × ${b}`, a:a*b}; },
  div31: ()=>{ const b=calcRI(2,9); let a; do{ a=b*calcRI(11,99); }while(a<100||a>999); return {q:`${a} ÷ ${b}`, a:a/b}; },
  addBig: ()=>{ const a=calcRI(100,9999), b=calcRI(100,9999); return {q:`${a} + ${b}`, a:a+b}; },
  subBig: ()=>{ const a=calcRI(100,9999), b=calcRI(1,a); return {q:`${a} - ${b}`, a:a-b}; },
  mul32: ()=>{ const a=calcRI(100,999), b=calcRI(10,99); return {q:`${a} × ${b}`, a:a*b}; },
  mul42: ()=>{ const a=calcRI(1000,9999), b=calcRI(10,99); return {q:`${a} × ${b}`, a:a*b}; },
  div42: ()=>{ const b=calcRI(10,99); let a; do{ a=b*calcRI(11,99); }while(a<1000||a>99999); return {q:`${a} ÷ ${b}`, a:a/b}; },
  decAdd: ()=>{ const a=calcRI(1,199)/10, b=calcRI(1,199)/10; return {q:`${calcFmt(a)} + ${calcFmt(b)}`, a:Math.round((a+b)*10)/10}; },
  decSub: ()=>{ const a=calcRI(1,199)/10, b=calcRI(0,Math.round(a*10))/10; return {q:`${calcFmt(a)} - ${calcFmt(b)}`, a:Math.round((a-b)*10)/10}; },
  decMul: ()=>{ const a=calcRI(1,99)/10, b=calcRI(2,9); return {q:`${calcFmt(a)} × ${b}`, a:Math.round(a*b*10)/10}; },
  paren: ()=>{ const r=calcRI(0,2); if(r===0){const a=calcRI(1,20),b=calcRI(1,20),c=calcRI(2,9); return {q:`(${a} + ${b}) × ${c}`, a:(a+b)*c};} if(r===1){const a=calcRI(2,9),b=calcRI(2,9),c=calcRI(1,a*b); return {q:`${a} × ${b} - ${c}`, a:a*b-c};} const a=calcRI(1,20),b=calcRI(2,9),c=calcRI(1,20); return {q:`${a} + ${b} × ${c}`, a:a+b*c}; },
};
function calcKinds(g, sem){
  const sem2 = sem==='下学期';
  if(g<=1) return sem2 ? ['add20','sub20','tens'] : ['add10','sub10'];
  if(g===2) return sem2 ? ['mulT','divT','add100','sub100'] : ['add100','sub100','add20','sub20'];
  if(g===3) return sem2 ? ['mul32','div31','addBig','subBig'] : ['addBig','subBig','mul21','div31'];
  if(g===4) return sem2 ? ['decAdd','decSub','mul32'] : ['mul32','div42','addBig','subBig'];
  if(g===5) return sem2 ? ['decMul','mul42','addBig','mul32'] : ['decAdd','decSub','decMul','mul32'];
  return ['decMul','mul42','div42','paren','addBig','subBig']; // 6 年级及以上
}
function genCalcProblems(g, sem, count, kindsOverride){
  const kinds = (kindsOverride && kindsOverride.length) ? kindsOverride : calcKinds(g, sem);
  const out = [];
  for(let i=0;i<count;i++){ out.push(CALC_GEN[kinds[calcRI(0, kinds.length-1)]]()); }
  return out;
}

  '6-下': ['百分数','圆柱和圆锥','正比例和反比例','扇形统计图','总复习']

function calcUnitsList(g, sem){
  const up = (sem === '上学期');
  return SU_UNITS[g + '-' + (up ? '上' : '下')] || [];
}
/* 第 idx 单元（1 基）的单元主题；idx<=0 或越界返回 ''（表示全部单元） */
function calcUnitTopics(g, sem, idx){
  if(!idx || idx < 1) return '';
  const list = calcUnitsList(g, sem);
  return (idx-1 < list.length) ? list[idx-1] : '';
}
/* 本地模式：根据单元主题尽量挑出对应的计算题型生成器；挑不出则退回整册题型 */
function calcKindsForUnit(g, sem, idx){
  const topic = calcUnitTopics(g, sem, idx);
  if(!topic) return calcKinds(g, sem);
  const t = topic;
  const has = (kw)=> t.indexOf(kw) >= 0;
  let kinds = [];
  if(has('加') || has('减')){
    if(has('10以内')) kinds.push('add10','sub10');
    else if(has('20以内')) kinds.push('add20','sub20');
    else if(has('100以内')) kinds.push('add100','sub100');
    else if(has('万以内') || has('两、三位数') || has('两三位') || has('三位')) kinds.push('addBig','subBig');
    else kinds.push('add20','sub20','add100','sub100');
  }
  if(has('乘')){
    if(has('表内') || has('1~6') || has('7~9')) kinds.push('mulT','divT');
    else if(has('一位数')) kinds.push('mul21');
    else if(has('两') || has('两位')) kinds.push('mul32');
    else if(has('三位')) kinds.push('mul32','mul42');
    else kinds.push('mulT','mul21','mul32');
  }
  if(has('除')){
    if(has('表内')) kinds.push('mulT','divT');
    else if(has('一位数')) kinds.push('div31');
    else if(has('两') || has('两位')) kinds.push('div31','div42');
    else kinds.push('div31','div42');
  }
  if(has('小数')){
    if(has('加') || has('减')) kinds.push('decAdd','decSub');
    if(has('乘')) kinds.push('decMul');
  }
  if(has('混合') || has('四则') || has('运算律') || has('简便')) kinds.push('paren');
  if(!kinds.length) kinds = calcKinds(g, sem);
  return [...new Set(kinds)];
}
/* 联网生成计算题的提示词：严格按苏教版年级/学期进度出题，可按指定单元专项出题 */
function calcOnlinePrompt(grade, semester, count, unitIndex){
  const topics = suMathTopics(grade, semester);
  const ut = calcUnitTopics(grade, semester, unitIndex);
  const unitLine = ut ? `\n【本次专项单元】只针对【第${unitIndex}单元：${ut}】出题，全部 ${count} 道计算题必须严格属于该单元的计算内容，不要出其他单元的题目。` : '';
  return `你是一位经验丰富的小学${grade}年级数学老师，使用苏教版（江苏教育出版社）教材（${semester}）。
请出 ${count} 道适合小学${grade}年级${semester}的「纯计算题」（口算或笔算），用于计算能力练习。
【苏教版本册内容范围】
${topics}${unitLine}
要求：
1. 题目必须严格限定在【苏教版${grade}年级${semester}】上述已学范围内，符合中国小学课程标准，不得超出本学期进度；题型应为竖式/混合/四则运算等计算题，不要出应用题（不要出现大段文字情境）。
2. 每题只给一个算式 q（不含等号与答案），例如 "12 + 9"、"34 × 5"、"7.2 ÷ 8"、"24 × (3 + 5)"、"100 - 37 - 28"；a 为该算式的数值答案（整数或小数，小数最多保留两位，能整除尽量整除）。
3. 难度循序渐进、覆盖本册多种计算类型，避免大量重复同一形式；不要出现负数答案，若涉及小数则数应为小学生可接受的范围。
4. 只返回 JSON，不要任何解释文字，不要输出思考过程，不要使用 markdown 代码块。格式严格如下：
{"problems":[{"q":"算式(不含等号)","a":数值答案}, ...]}
确保 problems 数组长度正好为 ${count}。`;
}
function llmValidateCalc(out, count){
  if(!out || !Array.isArray(out.problems)) throw new Error('返回结构不正确');
  const ps = out.problems.map(p=>{
    if(typeof p.q !== 'string') throw new Error('题目字段缺失');
    const a = Number(p.a);
    if(isNaN(a)) throw new Error('答案不是数字');
    return { q: p.q.trim(), a: Math.round(a*1000000)/1000000 };
  });
  return ps.slice(0, count);
}
async function genCalcOnline(grade, semester, count, unitIndex){
  const prompt = calcOnlinePrompt(grade, semester, count, unitIndex);
  const ctrl = new AbortController();
  const timer = setTimeout(()=>ctrl.abort(), LLM_CFG.timeout);
  try{
    const out = await llmChat(prompt, 0.7);   // 前端直连大模型，返回解析后的 JSON 对象
    return llmValidateCalc(out, count);
  } finally { clearTimeout(timer); }
}
async function startCalc(){

        showToast('⚠️ 未配置密钥，请点「🔑 设置密钥」填入 SiliconFlow Key');

        showToast('⚠️ 联网出题未成功（' + reason + '），已临时用本地题库');

function llmExtractJSON(text) {
  let t = String(text).replace(/<think[\s\S]*?<\/think>/gi, '').trim();
  // 去掉可能的 markdown 代码块包裹（```json ... ```）
  t = t.replace(/^```(?:json)?\s*/i, '').replace(/\s*```$/i, '').trim();
  const s = t.indexOf('{');
  const e = t.lastIndexOf('}');
  if (s === -1 || e === -1 || e < s) throw new Error('模型未返回可解析的 JSON');
  return JSON.parse(t.slice(s, e + 1));
}
function llmValidate(out, count) {
  if (!out || !Array.isArray(out.questions)) throw new Error('返回结构不正确');
  const qs = out.questions.map(q => {
    if (typeof q.q !== 'string' || !Array.isArray(q.o) || q.o.length !== 3) throw new Error('题目字段缺失');
    let a = Number(q.a);
    if (!(a >= 0 && a < 3)) throw new Error('答案下标越界');
    return { q: q.q, o: q.o.map(String), a, diff: q.diff || '中等', exp: String(q.exp || ''), img: String(q.img || '') };
  });
  return qs.slice(0, count);
}
async function callLLMDirect(grade, subject, edition, difficulty, semester, count) {
  const prompt = llmBuildPrompt(grade, subject, edition, difficulty, semester, count);
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), LLM_CFG.timeout);
  try {
    const out = await llmChat(prompt, 0.9);   // 前端直连大模型，返回解析后的 JSON 对象
    const qs = (out.questions || [])
      .map(q => ({ q: String(q.q), o: (q.o || []).map(String), a: Number(q.a), diff: String(q.diff || '中等'), exp: String(q.exp || ''), img: String(q.img || '') }))
      .filter(q => q.o.length === 3 && q.a >= 0 && q.a < 3);
    const norm = qs.map(normModelQ).filter(Boolean);   // 洗牌 + 去重 + 校验
    if (!norm.length) throw new Error('模型返回的题均不可用（选项重复或格式异常）');
    return norm.slice(0, count);
  } finally {
    clearTimeout(timer);
  }
}
/* 通用：前端直连大模型，发送一条 prompt，返回解析后的 JSON 对象（自动剥离 think/markdown 包裹）。
   未配置密钥时抛出明确错误，由调用方回退本地题库或提示用户在「🔑 设置密钥」中填写。 */
async function llmChat(prompt, temperature = 0.9, maxTokens = 0) {
  const key = getLLMKey();
  if (!key) throw new Error('未配置大模型密钥，请先点「🔑 设置密钥」填入 SiliconFlow Key');
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), LLM_CFG.timeout);
  try {
    const body = {
      model: getProvider().model,
      messages: [
        { role: 'system', content: '你是一位严谨的小学出题助手，只输出符合用户要求的合法 JSON，不要任何解释或思考过程。' },
        { role: 'user', content: prompt }
      ],
      temperature,
      chat_template_kwargs: { enable_thinking: false }
    };
    if (maxTokens > 0) body.max_tokens = maxTokens;
    const resp = await fetch(getProvider().base + '/chat/completions', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + key },
      signal: ctrl.signal,
      body: JSON.stringify(body)
    });
    if (!resp.ok) {
      const txt = await resp.text().catch(() => '');
      throw new Error('大模型 HTTP ' + resp.status + (txt ? (': ' + txt.slice(0, 160)) : ''));
    }
    const data = await resp.json();
    const content = data && data.choices && data.choices[0] && data.choices[0].message ? data.choices[0].message.content : '';
    if (!content) throw new Error('大模型返回为空');
    return llmExtractJSON(content);
  } finally {
    clearTimeout(timer);
  }
}

/* 英语大模型题配图：走「当前所选供应商」的 base（千问/DeepSeek 同为 SiliconFlow 通道），

const imgCache = new Map();
async function genImage(desc){
  if(!desc) return null;
  if(imgCache.has(desc)) return imgCache.get(desc);
  const key = getLLMKey();
  if(!key) return null;   // 未配置密钥则不出图，不影响做题
  const ctrl = new AbortController();
  const timer = setTimeout(()=>ctrl.abort(), 30000);
  try{
    const resp = await fetch(getProvider().base + '/images/generations', {
      method:'POST',
      headers:{ 'Content-Type':'application/json', 'Authorization':'Bearer '+key },
      signal: ctrl.signal,
      body: JSON.stringify({ model:'Kwai-Kolors/Kolors', prompt:'children flat illustration, simple clean, white background: '+desc, n:1, size:'512x512' })
    });
    if(!resp.ok) return null;
    const data = await resp.json();
    const item = (data && data.data && data.data[0]) ? data.data[0] : null;
    const url = item ? (item.url || (item.b64_json ? 'data:image/png;base64,'+item.b64_json : null)) : null;
    if(!url) return null;
    imgCache.set(desc, url);
    return url;
  }catch(e){ return null; }
  finally{ clearTimeout(timer); }
}

let backendOnline = false, backendLLM = false, backendWeb = false;
/* 把状态画到某个状态元素上（学习页的 #backendStatus 或侧边栏的 #svcStatus）。
   st = { cls:'on'|'off'|'checking', text:'...' } */
function paintBackend(el, st){

/* 真实连接探测：带密钥向 SiliconFlow 发一次轻量请求，确认「密钥有效 + 网络可达」。
   结果缓存 60s，避免每次切页都打网络。返回 { ok, detail }。 */
let _probeCache = { key:'', ok:null, ts:0, detail:'' };
async function probeLLM(){
  const rawKey = getLLMKey();
  // 缓存键带上供应商 id：切换模型后必须重新探测，否则状态灯会沿用上一个模型的结果
  const key = getProvider().id + '|' + rawKey;
  const now = Date.now();
  if(!rawKey){ _probeCache = { key:'', ok:false, ts:now, detail:'nokey' }; return { ok:false, detail:'nokey' }; }
  if(_probeCache.key === key && (now - _probeCache.ts) < 60000){
    return { ok:_probeCache.ok, detail:_probeCache.detail };
  }
  try{
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), 12000);
    // GET /v1/models 不消耗生成额度，仅用于验证密钥与连通性
    const resp = await fetch(getProvider().base + '/models', { headers:{ 'Authorization':'Bearer ' + rawKey }, signal: ctrl.signal });
    clearTimeout(timer);
    if(resp.ok){ _probeCache = { key, ok:true, ts:now, detail:'ok' }; return { ok:true, detail:'ok' }; }
    let detail = 'badkey';
    if(resp.status === 402 || resp.status === 403) detail = 'quota';
    else if(resp.status === 401) detail = 'badkey';
    else detail = 'other';
    _probeCache = { key, ok:false, ts:now, detail };
    return { ok:false, detail };
  }catch(e){
    _probeCache = { key, ok:false, ts:now, detail:'neterr' };
    return { ok:false, detail:'neterr' };
  }
}
/* 连接状态文案：必须「每次调用时」计算。
   原实现是 const 对象，ok 文案里的模型名在页面加载那一刻就被固化，
   切换模型后状态灯仍显示旧模型 —— 改为函数后可实时反映当前选择的模型。 */
function bkText(d){
  const p = getProvider();
  const M = {
    nokey:  '🔑 未设置密钥 · 仅本地题库',
    checking:'🟡 正在检测连接…',
    ok:     '🟢 已连接 · ' + p.emoji + ' ' + p.name + ' · ' + p.model,
    badkey: '🔴 密钥无效或已失效 · 仅本地题库',
    quota:  '🔴 额度不足 · 仅本地题库',
    neterr: '🔴 网络不通 · 仅本地题库',
    other:  '🔴 连接失败 · 仅本地题库'
  };
  return M[d] || M.other;
}
/* 探测后端是否在线（驱动学习页状态指示灯）。
   本应用为「浏览器直连大模型」：填了密钥就发真实请求验证，把真实的连接状态画出来，
   而不是只靠「localStorage 里有没有密钥字符串」糊弄用户。 */
async function checkBackend(){
  const els = [document.getElementById('backendStatus'), document.getElementById('svcStatus')].filter(Boolean);
  const key = getLLMKey();
  if(!key){
    backendOnline = false; backendLLM = false; backendWeb = false;
    els.forEach(el => paintBackend(el, { cls:'off', text:bkText('nokey') }));
    return;
  }
  els.forEach(el => paintBackend(el, { cls:'checking', text:bkText('checking') }));
  const r = await probeLLM();
  backendOnline = r.ok; backendLLM = r.ok; backendWeb = r.ok;
  const txt = bkText(r.detail);
  // render() 会重建 DOM，探测期间元素可能已被替换，故重新查询后再上色
  const els2 = [document.getElementById('backendStatus'), document.getElementById('svcStatus')].filter(Boolean);
  els2.forEach(el => paintBackend(el, { cls:(r.ok ? 'on' : 'off'), text:txt }));
}

  html += `<div class="learn-grid">` + mods.map(m=>`

      <span class="ce-u-label">🧮 计算练习单元：</span>

  html += `<p class="learn-tip">💡 出题方式可自由切换：<b>📚本地题库</b>从内置题库随机抽取并打乱选项；<b>🤖大模型</b>由当前所选的 <b>${curLLM.emoji}${curLLM.name}</b>（${curLLM.model}）按「${gradeName(grade)}·${semester}·语文人教版 / 数学苏教版 / 英语（语法）」现场生成 10 道可批改题（错题带解析），失败自动回退本地题库；<b>🧮数学计算</b>在「🤖大模型」模式下由 AI 按苏教版 ${gradeName(grade)}·${semester} 进度<b>联网生成 50 道计算题</b>（失败自动回退本地），「📚本地题库」模式下为本地随机出题；计算题可在上方<b>选择具体单元</b>专项练习（联网模式按苏教版该单元精准出题，本地模式尽量匹配题型）。</p>`;
  return html;
}

let poemIdx = 0, poemBlanks = [], poemInputs = [], poemAuthorOpts = [], poemAuthorSel = -1, poemSubmitted = false, poemScore = 0, poemResults = [], poemAuthorOk = false, poemRec = null;
let poemMode = 'char', poemSentQ = '', poemSentA = '', poemSentInput = '', poemSentResult = false;
function poemHasNext(item){ return item.lines.some((l,li)=> li < item.lines.length-1 && l.replace(/[\s，。、！？,.!?；;：:""''（）()…—\-\u3000]/g,'').length>=2); }
function setPoemMode(m){
  if(poemSubmitted) return;
  if(m==='sentence'){
    const bank = POEMS[grade] || POEMS['1'];
    const item = bank[poemIdx % bank.length];
    if(!poemHasNext(item)){ showToast('这首诗太短啦，换一首或选「答字」模式～'); return; }
  }
  poemMode = m; loadPoem(); renderPoem();
}
function loadPoem(){
  const bank = POEMS[grade] || POEMS['1'];
  const item = bank[poemIdx % bank.length];
  const allAuthors = [];
  Object.values(POEMS).forEach(list=> list.forEach(p=>{ if(p.author!==item.author && !allAuthors.includes(p.author)) allAuthors.push(p.author); }));
  const distract = shuffle(allAuthors).slice(0,2);
  poemAuthorOpts = shuffle([item.author, ...distract]);
  poemAuthorSel = -1;
  poemSubmitted = false; poemScore = 0; poemResults = []; poemAuthorOk = false;
  poemSentQ = ''; poemSentA = ''; poemSentInput = ''; poemSentResult = false;
  if(poemMode==='sentence'){
    poemBlanks = []; poemInputs = [];
    const cand = [];
    item.lines.forEach((line, li)=>{ if(li < item.lines.length-1){ const t=line.replace(/[\s，。、！？,.!?；;：:""''（）()…—\-\u3000]/g,''); if(t.length>=2) cand.push(li); } });
    if(cand.length===0){ poemMode='char'; return; }
    const qi = cand[Math.floor(Math.random()*cand.length)];
    poemSentQ = item.lines[qi];
    poemSentA = item.lines[qi+1] || '';
  } else {
    const k = (grade==='1'||grade==='2') ? 2 : (grade==='3'||grade==='4') ? 3 : 4;
    const positions = [];
    item.lines.forEach((line, li)=>{
      for(let ci=0; ci<line.length; ci++){
        const ch = line[ci];
        if(/[\s，。、！？,.!?；;：:""''（）()…—\-\u3000]/.test(ch)) continue;
        if(ch==='的'||ch==='了') continue;
        positions.push({line:li, chIdx:ci, char:ch});
      }
    });
    const sh = shuffle(positions);
    const chosen = []; const usedLine = new Set();
    for(const p of sh){ if(chosen.length>=k) break; if(usedLine.has(p.line)) continue; usedLine.add(p.line); chosen.push(p); }
    let i=0; while(chosen.length<k && i<sh.length){ if(!chosen.includes(sh[i])) chosen.push(sh[i]); i++; }
    poemBlanks = chosen;
    poemInputs = chosen.map(()=>'');
  }
}
function speakChinese(text, btn){
  try{
    if(!('speechSynthesis' in window)){ showToast('当前浏览器不支持朗读哦～'); return; }
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'zh-CN'; u.rate = 0.9; u.pitch = 1.0;
    const vs = window.speechSynthesis.getVoices();
    const zv = vs.find(v=>/zh[-_]?CN/i.test(v.lang)) || vs.find(v=>/^zh/i.test(v.lang));
    if(zv) u.voice = zv;
    if(btn){ btn.classList.add('playing'); u.onend = ()=> btn.classList.remove('playing'); u.onerror = ()=> btn.classList.remove('playing'); }
    window.speechSynthesis.speak(u);
  }catch(e){ if(btn) btn.classList.remove('playing'); showToast('朗读出错了～'); }
}

function startPoemVoice(mode, bi){
  if(!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)){ const s=main.querySelector('#poemStatus'); if(s){s.textContent='当前浏览器不支持语音识别，请直接输入汉字～'; s.classList.add('err');} return; }
  const bank = POEMS[grade] || POEMS['1'];
  const item = bank[poemIdx % bank.length];
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const rec = new SR();
  poemRec = rec;
  rec.lang='zh-CN'; rec.interimResults=false; rec.maxAlternatives=1;
  let btn, statusText;
  if(mode==='sentence'){ btn = main.querySelector('.poem-sent-voice'); statusText = '请说出下一句，例如「'+poemSentA+'」'; }
  else { const blank = poemBlanks[bi]; btn = main.querySelector('.poem-voice[data-b="'+bi+'"]'); statusText = '请说出空格里的字，例如「'+blank.char+'」'; }
  const statusEl = main.querySelector('#poemStatus');
  if(btn){ btn.classList.add('listening'); btn.textContent='🎙️'; }
  if(statusEl){ statusEl.textContent=statusText; statusEl.classList.remove('err'); }
  rec.onresult = (e)=>{
    const raw = (e.results && e.results[0] && e.results[0][0] && e.results[0][0].transcript) || '';
    const txt = raw.replace(/[\s，。、！？,.!?]/g,'');
    if(poemRec){ try{ poemRec.stop(); }catch(_){} poemRec=null; }
    if(btn){ btn.classList.remove('listening'); btn.textContent='🎤'; }
    if(mode==='sentence'){
      poemSentInput = raw.trim();
      const inp = main.querySelector('.poem-sent-input');
      if(inp) inp.value = raw.trim();
      if(statusEl) statusEl.textContent='语音识别：『'+raw.trim()+'』';
    } else {
      const blank = poemBlanks[bi];
      const ok = txt.includes(blank.char);
      const inp = main.querySelector('.poem-blank[data-b="'+bi+'"]');
      if(ok){
        poemInputs[bi] = blank.char;
        if(inp) inp.value = blank.char;
        if(statusEl) statusEl.textContent='语音识别：『'+raw.trim()+'』✓ 正确！';
      } else {
        if(inp) inp.value = raw.trim();
        poemInputs[bi] = raw.trim();
        if(statusEl) statusEl.textContent='听到：「'+raw.trim()+'」好像不对，再试一次，或直接输入～';
      }
    }
  };
  rec.onerror = (e)=>{
    let msg='语音识别出错了，请直接输入汉字～';
    if(e.error==='not-allowed'||e.error==='service-not-allowed') msg='麦克风权限被拒绝，请在浏览器允许使用麦克风，或直接输入～';
    else if(e.error==='no-speech') msg='没有听到声音，请再试一次～';
    else if(e.error==='audio-capture') msg='没有检测到麦克风，请直接输入～';
    if(statusEl) statusEl.textContent=msg;
    if(btn){ btn.classList.remove('listening'); btn.textContent='🎤'; }
    poemRec=null;
  };
  rec.onend = ()=>{ poemRec=null; if(btn){ btn.classList.remove('listening'); btn.textContent='🎤'; } };
  try{ rec.start(); }catch(err){ if(statusEl) statusEl.textContent='无法启动语音，请直接输入～'; poemRec=null; if(btn){ btn.classList.remove('listening'); btn.textContent='🎤'; } }
}

/* 大模型联网生成一篇适合当前年级的英语小短文 + 重点单词（含中文释义），返回 {title,text,words:[{en,zh}]} */
async function genEnglishModel(){
  const g = gradeName(grade);
  const prompt = `你是一位小学英语老师。请为${g}（中国小学${grade}年级）生成一篇简短的英语小短文，用于单词学习。
要求：
1. 短文主题贴近小学生日常生活，句子简单，长度约 4-6 句英文。
2. 从短文中挑出 5-6 个重点生词/关键词（避开 a、the、I、is、my、we 等过于常见的词），给出每个词的英文和中文意思。
3. 只输出 JSON，格式严格如下（不要任何解释、不要 markdown 代码块）：
{"title":"短文英文标题","text":"完整英文短文，句子之间用句号分隔","words":[{"en":"英文单词","zh":"中文意思"}]}
示例：{"title":"My Dog","text":"I have a dog. The dog is cute. We play together.","words":[{"en":"dog","zh":"狗"},{"en":"cute","zh":"可爱的"},{"en":"together","zh":"一起"}]}`;
  const out = await llmChat(prompt, 0.8);
  if(!out || !Array.isArray(out.words) || !out.words.length) throw new Error('大模型返回的短文格式不正确');
  const words = out.words.map(w=>({ en:String(w.en||'').trim(), zh:String(w.zh||'').trim() })).filter(w=> w.en && w.zh);
  if(!words.length) throw new Error('大模型未返回有效单词');
  return { title:String(out.title||'English Passage').trim(), text:String(out.text||'').trim(), words };
}

function highlightPassage(text, words){
  return text.split(/(\s+)/).map(tok=>{
    const m = tok.match(/^[A-Za-z']+/);
    if(!m) return esc(tok);
    const w = m[0].toLowerCase();
    const isTarget = words.some(wo=> w===wo.en.toLowerCase() || w.startsWith(wo.en.toLowerCase()));
    return isTarget ? `<span class="en-word">${esc(tok)}</span>` : esc(tok);
  }).join('');
}
function speakEnglish(text, btn){
  try{
    if(!('speechSynthesis' in window)){ showToast('当前浏览器不支持朗读哦～'); return; }
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'en-US'; u.rate = 0.85; u.pitch = 1.0;
    const vs = window.speechSynthesis.getVoices();
    const ev = vs.find(v=>/en[-_]?US/i.test(v.lang)) || vs.find(v=>/^en/i.test(v.lang));
    if(ev) u.voice = ev;
    if(btn){ btn.classList.add('playing'); u.onend = ()=> btn.classList.remove('playing'); u.onerror = ()=> btn.classList.remove('playing'); }
    window.speechSynthesis.speak(u);
  }catch(e){ if(btn) btn.classList.remove('playing'); showToast('朗读出错了～'); }
}

            let cls = 'opt';
            if(quizSubmitted){
              if(oi===item.a) cls += ' correct';
              else if(quizSel[qi]===oi) cls += ' wrong';
            } else if(quizSel[qi]===oi) cls += ' sel';
            return `<button class="${cls}" data-q="${qi}" data-o="${oi}">${esc(op)}</button>`;
          }).join('')}
        </div>
        ${quizSubmitted && quizSel[qi]!==item.a ? `
        <div class="q-exp">
          <div class="q-exp-ans">❌ 你选了「${esc(item.o[quizSel[qi]])}」，正确答案是「${esc(item.o[item.a])}」</div>
          ${(item.exp || choiceExplain(item)) ? `<div class="q-exp-text">💡 解析：${esc(item.exp || choiceExplain(item))}</div>` : ''}
        </div>` : ''}
      </div>`;
  });
  if(quizSubmitted){
    const correct = test.qs.filter((item,qi)=>quizSel[qi]===item.a).length;
    const allRight = correct===test.qs.length;
    html += `
      <div class="quiz-result ${allRight?'all':''}">
        <div class="r-score">你答对了 <b>${correct}</b> / ${test.qs.length} 题</div>
        <div class="r-msg">${allRight?'🎉 全对！你真是小学霸！' : '继续加油，再练一次会更棒！'}</div>
        <div class="r-btns">
          <button class="btn primary" id="quizRetry">🔄 再做一次</button>
          <button class="btn cancel" id="quizBack2">返回列表</button>
        </div>
      </div>`;
  } else {
    html += `<button class="btn quiz-submit" id="quizSubmit">✅ 提交答卷</button>`;
  }
  html += `</div>`;
  main.innerHTML = html;

  // 英语大模型题：懒加载配图（生成成功才显示；生成失败或图片损坏则显示「重新加载」按钮）
  main.querySelectorAll('.q-img-wrap[data-img]').forEach(wrap=>{
    const el = wrap.querySelector('.q-img');
    const loading = wrap.querySelector('.q-img-loading');
    const reload = wrap.querySelector('.q-img-reload');
    const desc = wrap.dataset.img;
    async function tryLoad(){
      imgCache.delete(desc);             // 每次都重新向大模型请求，确保「重新获取当前题目图片」
      loading.style.display = 'block';
      reload.style.display = 'none';
      const url = await genImage(desc);
      if(url){
        el.onload  = ()=>{ loading.style.display='none'; };
        el.onerror = ()=>{ loading.style.display='none'; reload.style.display='inline-block'; };
        el.src = url;
      } else {
        loading.style.display = 'none';
        reload.style.display = 'inline-block';
      }
    }
    reload.onclick = tryLoad;
    tryLoad();
  });

  main.querySelector('#quizBack').onclick = ()=>{ learnView='list'; render(); };
  if(quizSubmitted){
    main.querySelector('#quizRetry').onclick = ()=>{ quizSel = new Array(test.qs.length).fill(null); quizSubmitted=false; render(); };
    const b2 = main.querySelector('#quizBack2'); if(b2) b2.onclick = ()=>{ learnView='list'; render(); };
  } else {
    main.querySelectorAll('.opt').forEach(b=>{
      b.onclick = ()=>{
        const qi = +b.dataset.q; quizSel[qi] = +b.dataset.o;
        const grp = b.parentElement.querySelectorAll('.opt');
        grp.forEach(x=>x.classList.remove('sel'));
        b.classList.add('sel');
      };
    });
    main.querySelector('#quizSubmit').onclick = ()=>{
      if(quizSel.some(x=>x===null)){ showToast('还有题目没选哦～'); return; }
      quizSubmitted = true; render();
      freezeBtns('#quizBack, #quizBack2', 3, '请先读解析');
    };
  }
}

  // 统计每天任务总数

    if(n>0) counts[fmtISO(d)] = n;

    <h1 class="page-title">${isSchool?'🎀 校内任务':'🏡 家庭作业'}</h1>
    <p class="page-sub">${isSchool?'上课、作业、班级活动都能记在这里～':'复习、预习、阅读、练字都来这里打卡！'} 想发布新任务请到「家长审核」页哦～</p>
    ${(()=>{ const sel=calSelISO?new Date(calSelISO.replace(/-/g,'/')+' 12:00:00'):today.date; const ei=em[fmtISO(sel)]||{cnt:0,pts:0}; const lab=calSelISO?(Number(calSelISO.slice(5,7))+'/'+Number(calSelISO.slice(8,10))+' '):'今天'; return `<div class="earn-today">🎉 ${lab}已完成 <b>${ei.cnt}</b> 项任务，获得 <b>${ei.pts}</b> 积分～</div>`; })()}
    <div class="date-bar">📅 今天：${today.label}<button class="view-switch" id="toWeekBtn">🗓 周视图</button></div>
    <div class="cal-head">
      <button class="cal-nav" id="calPrev" title="上个月">‹</button>
      <span class="cal-title">${calYear}年${calMonth+1}月</span>
      <button class="cal-nav" id="calNext" title="下个月">›</button>
    </div>
    <div class="cal-grid">
      ${['日','一','二','三','四','五','六'].map(w=>`<div class="cal-wd">${w}</div>`).join('')}
      ${Array.from({length:startDow},()=>`<div class="cal-cell blank"></div>`).join('')}
      ${Array.from({length:daysInMonth},(_,i)=>{
        const dd=i+1; const d=new Date(calYear, calMonth, dd);
        const iso=fmtISO(d); const n=counts[iso]||0;
        const ei=em[fmtISO(d)]||{cnt:0,pts:0};
        const h = holi[iso]; const isRest = h && h.type==='rest'; const isWork = h && h.type==='work';
        const dow = d.getDay(); const isWeekend = (dow===0 || dow===6);
        return `<button class="cal-cell ${iso===today.iso?'today':''} ${iso===calSelISO?'sel':''} ${(n>0||ei.pts>0)?'has':''} ${isRest?'holi':''} ${isWork?'workday':''}" data-iso="${iso}">
          <span class="cal-day-num">${dd}</span>${isRest?`<span class="cal-holi">${esc(h.name)}</span>`:(isWork?`<span class="cal-work">班</span>`:(isWeekend?`<span class="cal-weekend">周末</span>`:''))}${n>0?`<span class="cal-count">${n}</span>`:''}${ei.pts>0?`<span class="cal-earn">+${ei.pts}💎</span>`:''}
        </button>`;
      }).join('')}
    </div>`;
  // 选中某天 → 下方展示当天任务
  let selTasks = [];
  if(calSelISO){
    const sd = new Date(calSelISO.replace(/-/g,'/')+' 12:00:00');
    selTasks = dated.filter(t=>taskMatchesDate(t, sd));

  if(toWeek) toWeek.onclick = ()=>{ publishView='week'; render(); };
  const prev = document.getElementById('calPrev');
  if(prev) prev.onclick = ()=>{ calMonth--; if(calMonth<0){ calMonth=11; calYear--; } calSelISO=''; render(); };
  const next = document.getElementById('calNext');

/* ---- 任务卡片 ---- */
/* ============ 任务计时（秒表） ============ */
function timerElapsed(t){ return (Number(t.elapsed)||0) + (t.timerStartAt ? Date.now() - t.timerStartAt : 0); }
function formatElapsed(ms){
  let s = Math.max(0, Math.floor(ms/1000));
  const h = Math.floor(s/3600); s -= h*3600;
  const m = Math.floor(s/60); s -= m*60;
  const p = n => String(n).padStart(2,'0');
  return (h>0 ? p(h)+':' : '') + p(m)+':'+p(s);
}
function startTaskTimerGlobal(){
  if(taskTimerTick) return;
  taskTimerTick = setInterval(updateRunningTimers, 1000);
}
function updateRunningTimers(){
  if(!main) return;
  const anyRunning = tasks.some(t => t.timed && t.timerStartAt);
  tasks.forEach(t => {
    if(t.timed && t.timerStartAt){
      const el = main.querySelector('[data-timer="'+t.id+'"]');
      if(el) el.textContent = formatElapsed(timerElapsed(t));
    }
  });
  if(!anyRunning && taskTimerTick){ clearInterval(taskTimerTick); taskTimerTick = null; }
}
function toggleTaskTimer(t){
  if(t.timerStartAt){
    t.elapsed = timerElapsed(t);   // 暂停：把已跑时间结算进 elapsed
    t.timerStartAt = null;
  } else {
    t.timerStartAt = Date.now();   // 开始 / 继续
    startTaskTimerGlobal();
  }
  save(); render();
}
function resetTaskTimer(t){
  t.elapsed = 0; t.timerStartAt = null; save(); render();
}
function settleTaskTimer(t){        // 完成任务时结算
  if(t.timerStartAt){ t.elapsed = timerElapsed(t); t.timerStartAt = null; }
}
function endTaskTimer(t){            // 点击「结束」：停止计时 + 完成任务 + 显示本次用时
  const blkMsg = taskDoneBlockMsg(t, null);
  if(blkMsg){ showToast(blkMsg); return; }
  settleTaskTimer(t);
  setTaskDayDone(t, fmtISO(todayInfo().date), true);   // 按天记录「完成」（带逻辑时钟，撤销才能跨端同步）
  setTaskCancel(t, false, t.reason || '');             // 完成即处于非取消态
  save(); render(); showEncourage(t); refreshBadges();   // showEncourage 已含「本次用时」
}
function taskCard(t, date){
  const el = document.createElement('div');
  const d = date ? fmtISO(date) : null;
  const isCancelled = !!t.cancelled;
  const isDone = !isCancelled && (date ? doneOnDay(t, date) : !!t.done);
  el.className = `task ${t.type} ${isDone?'done':''} ${isCancelled?'cancelled':''}`;
  const cancelReasonHtml = (isCancelled && t.reason)
    ? `<p class="t-reason" data-reason="1"><span class="r-label">💬 取消原因：</span>${esc(t.reason)}</p>`
    : '';
  let doneTimeHtml = '';
  if(isDone){
    const p=n=>String(n).padStart(2,'0');
    if(t.doneAt){ const dt=new Date(t.doneAt); doneTimeHtml = `<p class="t-done-time">🕐 完成时间：${p(dt.getHours())}:${p(dt.getMinutes())}</p>`; }
    else if(t.doneDate){ const dd = new Date(String(t.doneDate).replace(/-/g,'/')); doneTimeHtml = `<p class="t-done-time">🕐 完成于 ${dd.getFullYear()}年${p(dd.getMonth()+1)}月${p(dd.getDate())}日</p>`; }
  }
  let actions = '';
  if(!isDone && !isCancelled){
    actions = `
      <button class="icon-btn edit" title="修改">✏️</button>
      <button class="icon-btn ok" title="完成">✅</button>
      <button class="icon-btn cancel" title="取消">🚫</button>
      <button class="icon-btn del" title="删除">🗑️</button>`;
  } else {
    actions = `
      <button class="icon-btn edit" title="修改">✏️</button>
      <button class="icon-btn undo" title="恢复为未完成">↩️</button>
      <button class="icon-btn del" title="删除">🗑️</button>`;
  }
  el.innerHTML = `
    <div class="body">
      <div class="t-title-wrap">
        <p class="t-title">${esc(t.title)}</p>
      </div>
      <div class="t-meta">
        <span class="t-meta-item">💎 ${Number(t.points)||1} 积分</span>
        ${(t.repeat && t.repeat!=='once' && REPEATS[t.repeat]) ? `<span class="t-meta-item">🔁 ${REPEATS[t.repeat]}</span>` : ''}
        ${(t.startDate || t.endDate) ? `<span class="t-meta-item">📅 ${mdLabel(t.startDate||t.deadline)}${t.endDate ? ' – '+mdLabel(t.endDate) : ''}</span>` : ''}
      </div>
      ${cancelReasonHtml}
      ${doneTimeHtml}
      ${t.timed ? `
      <div class="t-timer">
        <span class="t-timer-ico">⏱️</span>
        ${!isDone && !isCancelled
          ? `<span class="t-timer-val" data-timer="${t.id}">${formatElapsed(timerElapsed(t))}</span>`
          : `<span class="t-timer-val used">本次用时 ${formatElapsed(timerElapsed(t))}</span>`}
        ${!isDone && !isCancelled ? `
          <button class="icon-btn t-start ${t.timerStartAt?'on':''}" data-timerbtn="${t.id}" title="${t.timerStartAt?'暂停':'开始计时'}">${t.timerStartAt?'⏸️':'▶️'}</button>
          ${(t.timerStartAt || t.elapsed>0) ? `<button class="icon-btn t-end" data-timerend="${t.id}" title="结束">⏹</button>` : ''}
          ${t.elapsed>0 && !t.timerStartAt ? `<button class="icon-btn t-reset" data-timerreset="${t.id}" title="清零">↺</button>` : ''}
        ` : ''}
      </div>` : ''}
      <div class="actions">${actions}</div>
    </div>`;
  if(!isDone && !isCancelled){
    el.querySelector('.ok').onclick = ()=>{
      const blkMsg = taskDoneBlockMsg(t, null);
      if(blkMsg){ showToast(blkMsg); return; }
      settleTaskTimer(t);
      setTaskDayDone(t, d, true);                    // d = 卡片所在日期；无日期上下文时按今天
      setTaskCancel(t, false, t.reason || '');
      save(); render(); showEncourage(t); refreshBadges();
    };
    el.querySelector('.cancel').onclick = ()=>{
      promptModal({
        title:'取消任务', message:'请填写取消原因（必填）：', placeholder:'例如：今天身体不太舒服', defaultValue:t.reason||'', confirmText:'下一步',
        onConfirm:(r, errEl)=>{
          if(!r || r.trim()===''){ errEl.textContent='取消原因不能为空哦～'; errEl.style.display='block'; return false; }
          confirmModal({ title:'确认取消', message:'确定取消这个任务吗？', confirmText:'确定取消', danger:true, onConfirm:()=>{
            settleTaskTimer(t); setTaskCancel(t, true, r.trim()); save(); render();
          }});
        }
      });
    };
    const tb = el.querySelector('[data-timerbtn]');
    if(tb) tb.onclick = ()=> toggleTaskTimer(t);
    const te = el.querySelector('[data-timerend]');
    if(te) te.onclick = ()=> endTaskTimer(t);
    const tr = el.querySelector('[data-timerreset]');
    if(tr) tr.onclick = ()=> resetTaskTimer(t);
  } else {
    el.querySelector('.undo').onclick = ()=>{
      // 撤销完成：按天记录「撤销」（带逻辑时钟），同步到其它设备后那边也会恢复未完成；
      // 旧逻辑是 done 取 OR + doneDates 并集，撤销会被另一端仍为 true 的完成态吞掉，永远同步不过去
      setTaskDayDone(t, d, false);
      setTaskCancel(t, false, t.reason || '');
      save(); render();
    };
  }
  const editBtn = el.querySelector('.edit');
  if(editBtn) editBtn.onclick = ()=> editTask(t);
  const rEl = el.querySelector('[data-reason]');
  if(rEl) rEl.onclick = ()=> editReason(t);
  el.querySelector('.del').onclick = ()=>{ confirmModal({ message:'确定删除这个任务吗？', confirmText:'删除', danger:true, onConfirm:()=>{ tasks = tasks.filter(x=>x.id!==t.id); save(); render(); } }); };
  return el;
}

/* ---- 修改任务（与创建同样的弹窗范围） ---- */
function editTask(t){ openModal(t); }

/* ---- 编辑取消原因（点击卡片上的原因文字可修改） ---- */
function editReason(t){
  const label = t.cancelled ? '取消原因' : '原因';
  promptModal({ title:'修改'+label, message:'修改一下'+label+'吧（可留空）：', placeholder:'选填', defaultValue:t.reason||'', confirmText:'保存', onConfirm:(val)=>{
    t.reason = (val||'').trim(); save(); render();
  }});
}

/* ============ 完成任务激励弹窗 ============ */
function showEncourage(t){
  const today = todayInfo().date;
  const visOk = x => taskVisible(x) && !x.cancelled;
  const totalAll = tasks.filter(visOk).length;
  const doneAll = tasks.filter(x => visOk(x) && x.done).length;

  const totalToday = tasks.filter(x => visOk(x) && taskMatchesDate(x, today)).length;
  const doneToday = tasks.filter(x => visOk(x) && doneOnDay(x, today)).length;
  const total = totalToday > 0 ? totalToday : totalAll;
  const doneCount = totalToday > 0 ? doneToday : doneAll;
  const allDone = total>0 && doneCount>=total;

  ov.className = 'overlay encourage-ov';
  ov.innerHTML = `
    <div class="encourage-modal ${allDone?'all':''}">
      <div class="enc-emoji">${allDone?'🏆':'🎉'}</div>
      <div class="enc-title">${allDone?'全部完成啦！':'做得好！'}</div>
      <div class="enc-msg">${allDone
        ? '你完成了全部 <b>'+total+'</b> 项任务，真是说到做到的小勇士，为你骄傲！💪'
        : '你已完成 <b>'+doneCount+'</b> 项任务！<br>还有 <b>'+(total-doneCount)+'</b> 项，再接再厉哦～'}</div>
      ${usedLine}
      ${doneTimeLine}
      <button class="enc-ok" id="encOk">继续加油 💪</button>
    </div>`;
  document.body.appendChild(ov);
  ov.querySelector('#encOk').onclick = ()=> ov.remove();
  ov.onclick = (e)=>{ if(e.target===ov) ov.remove(); };
}

/* 任务是否对孩子可见/计入统计：待家长审核(approved===false)的任务不显示，直到批准 */
function taskVisible(t){ return t.approved !== false; }
/* 判断任务在指定日期“应出现”（按重复周期）。d 为 Date 对象 */
function taskMatchesDate(t, d){
  if(!t.deadline) return false;            // 未安排日期的任务不在按日期的视图中显示（仅在"我的任务"总览可见）
  const iso = fmtISO(d);
  const startIso = t.startDate || t.deadline;   // 有开始日期以开始日期为准
  if(iso < startIso) return false;              // 早于开始日期不出现
  if(t.endDate && iso > t.endDate) return false; // 晚于结束日期不出现
  const wd = d.getDay();
  switch(t.repeat){
    // 不重复：设了「开始+结束」则在区间内每天显示；只设开始则只在开始日显示；都没设按 deadline
    case 'once':   return (t.startDate && t.endDate) ? true : (iso === (t.startDate || t.deadline));
    case 'daily':  return true;
    case 'weekday':return wd>=1 && wd<=5;   // 周一至周五
    case 'weekend':return wd===0 || wd===6; // 周六、日
    case 'mon': return wd===1; case 'tue': return wd===2; case 'wed': return wd===3;
    case 'thu': return wd===4; case 'fri': return wd===5; case 'sat': return wd===6;
    case 'sun': return wd===0;
    default: return iso === t.deadline;
  }
}
/* 判断任务在指定日期是否“已完成”。重复任务按 doneDates(每天完成历史) 判定当天完成 */
function doneOnDay(t, d){
  if(!t || t.cancelled || !t.done) return false;   // 取消态优先显示（历史积分/星星仍保留，见 taskDoneDays）
  if(!t.repeat || t.repeat==='once') return true;
  const iso = fmtISO(d);
  if(Array.isArray(t.doneDates) && t.doneDates.includes(iso)) return true;

/* 精确到「今天自然日」完成的任务（单次按 doneDate/doneAt，周期按 doneDates 历史） */
function earnedToday(t){

function todayEarnedInfo(type){

  for(const t of tasks){

/* 某页面类型在「指定日期」已完成任务数与获得积分（周期任务按完成记录把每次完成归属到对应日期） */
function earnedOnDate(type, d){
  const iso = fmtISO(d); let cnt = 0, pts = 0;
  for(const t of tasks){

function buildEarnedMap(type){
  const m = {};
  for(const t of tasks){
    if(t.type !== type) continue;
    for(const iso of taskDoneDays(t)){

function hashHue(seed){ let h=0; const s=String(seed); for(let i=0;i<s.length;i++){ h=(h*31+s.charCodeAt(i))>>>0; } return h%360; }

/* 本地题库（BANK）题目没有 exp 字段，这里根据题型特征生成一句「为什么选这个选项」的解析。

function localExplain(q){
  if(!q || !Array.isArray(q.o) || q.a==null || q.a<0 || q.a>=q.o.length) return '';

  const m = t.match(/([\d]+\.?\d*)\s*([\+\-\*\/])\s*([\d]+\.?\d*)\s*=\s*\??/);
